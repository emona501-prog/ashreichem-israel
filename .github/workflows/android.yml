# בונה APK חתום של "אשריכם ישראל" (עם הווידג'ט) ומפרסם אותו בעמוד ההורדות (Releases).
# רץ רק כשמשתנה משהו בתיקיית app (האפליקציה עצמה טוענת את האתר החי, כך ששינויים באתר לא דורשים בנייה חדשה),
# או בלחיצה ידנית: Actions ← Build APK ← Run workflow.
name: Build APK
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: פתיחת מפתח החתימה
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          P="$(printf '%s' "$KEYSTORE_PASS" | LC_ALL=C tr -cd 'A-Za-z0-9')"
          echo "אורך הסיסמה אחרי ניקוי: ${#P} (צריך 28)"
          if [ -z "$P" ]; then echo "::warning::חסר הסוד KEYSTORE_PASS – בונים רק לבדיקה, בלי פרסום (Settings ← Secrets and variables ← Actions)"; exit 0; fi
          echo "::add-mask::$P"
          printf '%s' "$P" > "$RUNNER_TEMP/pw"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in signing/release.p12.enc -out "$RUNNER_TEMP/release.jks" -pass file:"$RUNNER_TEMP/pw" || { echo "::error::הסיסמה KEYSTORE_PASS לא נכונה"; exit 1; }
          rm -f "$RUNNER_TEMP/pw"
          keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$P" >/dev/null || { echo "::error::הסיסמה KEYSTORE_PASS לא נכונה"; exit 1; }
          echo "KS_PASS=$P" >> "$GITHUB_ENV"
          echo "HAVE_KEY=1" >> "$GITHUB_ENV"
          echo "::notice::מפתח החתימה תקין"
      - run: npm ci || npm install
      - run: npx cap sync android
      - name: גרסה
        id: ver
        run: echo "v=$(jq -r .version version.json)" >> "$GITHUB_OUTPUT"
      - name: בניית APK חתום
        working-directory: app/android
        env:
          KEYSTORE_PATH: ${{ env.HAVE_KEY == '1' && format('{0}/release.jks', runner.temp) || '' }}
          KEYSTORE_PASS: ${{ env.KS_PASS }}
          VERSION_NAME: ${{ steps.ver.outputs.v }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle.log" || { M=$(grep -v "^\s*$" "$RUNNER_TEMP/gradle.log" | grep -B30 -A12 "What went wrong" | head -60 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g'); echo "::error title=gradle::$M"; exit 1; }
      - name: שם הקובץ
        run: cp android/app/build/outputs/apk/release/app-release*.apk ashreichem-israel.apk
      - name: בדיקה בלבד (בלי חתימה)
        if: env.HAVE_KEY != '1'
        uses: actions/upload-artifact@v4
        with:
          name: test-build-unsigned
          path: app/ashreichem-israel.apk
      - name: פרסום בעמוד ההורדות
        if: env.HAVE_KEY == '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: אשריכם ישראל ${{ steps.ver.outputs.v }}
          body_path: app/RELEASE_NOTES.md
          files: app/ashreichem-israel.apk
          make_latest: true
