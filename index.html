<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#24456b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="אשריכם ישראל">
<title>אשריכם ישראל – תפילות, שיעורים ופעילויות</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Frank+Ruhl+Libre:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --fs:17px;
  --bg:#f5f3ee; --card:#ffffff; --ink:#1d2733; --muted:#6b7480; --line:#e6e2d9;
  --pri:#24456b; --pri2:#3a6596; --acc:#c49a2c; --ok:#2f7d55; --warn:#b5462f;
  --soft:#eef3f8; --gold-soft:#faf3df; --r:16px; --sh:0 2px 10px rgba(30,40,60,.07);
}
body.dark{--bg:#12171d;--card:#1b222b;--ink:#eef1f4;--muted:#9aa5b1;--line:#2b3440;--pri:#7fb0e6;--pri2:#9cc4ee;--soft:#1f2a36;--gold-soft:#2a2516;--sh:none}
body.contrast{--bg:#fff;--card:#fff;--ink:#000;--muted:#222;--line:#000;--pri:#002b80;--pri2:#002b80;--acc:#7a5200;--soft:#fff;--gold-soft:#fff}
body.contrast .card,body.contrast .btn,body.contrast .chip{border:2px solid #000!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:var(--fs)}
body{margin:0;font-family:'Assistant',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;padding-bottom:84px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--pri)}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.top{position:sticky;top:0;z-index:20;background:var(--pri);color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.15)}
body.dark .top{background:#18324f}
.topbar{display:flex;align-items:center;gap:10px;padding:10px 14px 8px}
.topbar h1{margin:0;font-size:1.25rem;font-weight:800;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .hdate{font-size:.74rem;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{background:rgba(255,255,255,.14);border:0;color:#fff;width:42px;height:42px;border-radius:12px;font-size:1.15rem;cursor:pointer;flex:none}
.ticker{background:var(--acc);color:#1c1400;overflow:hidden;white-space:nowrap;font-weight:700;font-size:.92rem;height:34px;display:flex;align-items:center;cursor:pointer}
.ticker .lbl{background:#1c1400;color:var(--acc);padding:0 10px;height:100%;display:flex;align-items:center;flex:none;font-size:.82rem;z-index:2}
.ticker .track{display:inline-block;padding-inline-start:100%;animation:run var(--tk,30s) linear infinite}
.ticker .track span{margin-inline-end:48px}
@keyframes run{from{transform:translateX(0)}to{transform:translateX(100%)}}
body.nomotion .ticker .track{animation:none;padding-inline-start:12px}
@media (prefers-reduced-motion:reduce){.ticker .track{animation:none;padding-inline-start:12px}}
.rolebar{background:#2f7d55;color:#fff;font-size:.85rem;padding:5px 14px;display:flex;justify-content:space-between;align-items:center}
.rolebar button{background:#fff;color:#2f7d55;border:0;border-radius:8px;padding:2px 10px;font-weight:700}
main{max-width:720px;margin:0 auto;padding:14px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:14px;margin-bottom:12px;border:1px solid var(--line)}
h2{font-size:1.2rem;margin:4px 0 10px;font-weight:800}
h3{font-size:1.05rem;margin:0 0 8px;font-weight:700}
.muted{color:var(--muted);font-size:.9rem}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.qa{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 6px;text-align:center;cursor:pointer;box-shadow:var(--sh);min-height:92px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.qa .em{font-size:1.7rem;line-height:1}
.qa b{font-size:.95rem}
.qa small{color:var(--muted);font-size:.78rem}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:600;font-size:.92rem}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
body.dark .chip.on{color:#10161d}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.time{font-size:1.35rem;font-weight:800;min-width:64px;color:var(--pri);font-variant-numeric:tabular-nums}
.row .main{flex:1;min-width:0}
.row .main b{display:block}
.badge{display:inline-block;font-size:.78rem;font-weight:700;border-radius:999px;padding:2px 9px;background:var(--soft);color:var(--pri)}
.badge.soon{background:#e5f4ec;color:var(--ok)}
.badge.gold{background:var(--gold-soft);color:#8a6a10}
.past{opacity:.45}
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:700;cursor:pointer;background:var(--pri);color:#fff;min-height:44px}
body.dark .btn{color:#10161d}
.btn.sec{background:var(--soft);color:var(--pri)}
.btn.ghost{background:transparent;color:var(--pri);border:1px solid var(--line)}
.btn.red{background:#fbe9e5;color:var(--warn)}
.btn.sm{padding:6px 12px;min-height:36px;font-size:.88rem}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.search{width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-size:1rem}
.shulcard{display:flex;gap:12px;align-items:center;cursor:pointer}
.thumb{width:62px;height:62px;border-radius:14px;background:var(--soft) center/cover;flex:none;display:flex;align-items:center;justify-content:center;font-size:1.6rem}
.star{background:none;border:0;font-size:1.4rem;cursor:pointer;color:var(--acc);padding:4px}
.hero{height:170px;border-radius:var(--r);background:var(--soft) center/cover;margin-bottom:12px;display:flex;align-items:flex-end}
.hero.empty{align-items:center;justify-content:center;font-size:3rem}
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.gallery div{aspect-ratio:1;border-radius:10px;background:center/cover;cursor:pointer;position:relative}
.gallery .x{position:absolute;top:4px;left:4px;background:rgba(0,0,0,.6);color:#fff;border:0;border-radius:8px;width:28px;height:28px}
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;z-index:30;padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;background:none;border:0;padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.78rem;color:var(--muted);cursor:pointer;font-weight:600}
.nav button .em{font-size:1.35rem}
.nav button.on{color:var(--pri)}
.nav button.on .em{transform:scale(1.12)}
.modal-bg{position:fixed;inset:0;background:rgba(10,15,25,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--card);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px 26px;animation:up .2s ease}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.modal .mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.modal .mh h2{margin:0}
label.f{display:block;font-weight:700;font-size:.9rem;margin:10px 0 4px}
.inp{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:1rem}
textarea.inp{min-height:80px}
.ed{display:grid;grid-template-columns:1.1fr 1fr auto;gap:6px;align-items:center;margin-bottom:6px}
.ed .inp{padding:8px;font-size:.92rem}
.ed2{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:10px;border:1px dashed var(--line);border-radius:12px;margin-bottom:8px}
.ed2 .full{grid-column:1/-1}
.menu .row{cursor:pointer;font-weight:700}
.menu .row .em{font-size:1.4rem;width:34px;text-align:center}
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:#1d2733;color:#fff;padding:11px 18px;border-radius:14px;z-index:60;font-weight:600;max-width:90%;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.th{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.th button{aspect-ratio:1;border-radius:8px;border:1px solid var(--line);background:var(--card);font-size:.75rem;cursor:pointer;padding:0}
.th button.on{background:var(--ok);color:#fff;border-color:var(--ok)}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stat div{background:var(--soft);border-radius:12px;padding:10px 4px}
.stat b{display:block;font-size:1.5rem;color:var(--pri)}
.hl{background:var(--gold-soft);border:1px solid #ead9a6}
.empty-msg{text-align:center;color:var(--muted);padding:20px 8px}
.sw{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.sw input[type=checkbox]{width:24px;height:24px}
.ad img{width:100%;border-radius:12px;margin-top:8px}
.calhead{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.cb{background:var(--soft)!important;color:var(--pri)!important;font-size:1.6rem!important;font-weight:800}
.cgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cgrid.wd div{text-align:center;font-weight:800;font-size:.85rem;color:var(--muted);padding-bottom:4px}
.cgrid.wd div:last-child{color:var(--acc)}
.cd{position:relative;aspect-ratio:1/1.12;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:4px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:0;overflow:hidden}
.cd .hd{font-weight:800;font-size:1.15rem;line-height:1.2}
.cd .gd{font-size:.68rem;color:var(--muted);line-height:1}
.cd .hn{font-size:.55rem;font-weight:700;color:#9b2c2c;line-height:1.1;margin-top:2px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cd.sh{background:var(--gold-soft)}
.cd.hol{background:#fdecec}
body.dark .cd.hol{background:#3a2222}
.cd.today{border:2.5px solid var(--pri);box-shadow:0 0 0 2px rgba(36,69,107,.15)}
.dots{position:absolute;bottom:4px;display:flex;gap:3px}
.dots i,.legend i{width:7px;height:7px;border-radius:50%;display:inline-block}
.dg{background:var(--acc)}.db{background:var(--pri2)}.dn{background:var(--ok)}
.legend{display:flex;gap:14px;justify-content:center;font-size:.78rem;color:var(--muted);margin-top:10px;flex-wrap:wrap}
.legend i{margin-inline-end:4px}

.near{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;border-radius:20px;padding:12px 12px 6px;margin-bottom:14px;box-shadow:0 6px 18px rgba(36,69,107,.28)}
body.dark .near{background:linear-gradient(135deg,#1d3a5c,#284d78)}
body.contrast .near{background:#002b80;border:2px solid #000}
.near-h{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:.95rem;margin-bottom:6px}
.near-in{background:var(--acc);color:#1c1400;border-radius:999px;padding:3px 12px;font-size:.9rem}
.near-r{display:flex;gap:8px;align-items:stretch;border-top:1px solid rgba(255,255,255,.18);padding:8px 0}
.near-r:first-of-type{border-top:0}
.near-main{flex:1;display:flex;gap:12px;align-items:center;background:none;border:0;color:#fff;text-align:right;cursor:pointer;padding:0;min-width:0}
.near-t{font-size:2.1rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.near-x{display:flex;flex-direction:column;min-width:0}
.near-x b{font-size:1.1rem}
.near-x span{opacity:.95;line-height:1.25}
.near-x small{opacity:.8;font-size:.8rem}
.near-go{flex:none;background:#fff;color:var(--pri);border-radius:14px;width:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-decoration:none;font-weight:800;font-size:.85rem;gap:2px}
.near-go{font-size:1.3rem}.near-go span{font-size:.8rem}
.cmp-wrap{position:relative;width:260px;height:270px;margin:6px auto 0}
.cmp-top{position:absolute;top:-2px;left:50%;transform:translateX(-50%);color:var(--warn);font-size:1.3rem;z-index:2}
.cmp{position:absolute;top:18px;left:5px;width:250px;height:250px;border-radius:50%;border:3px solid var(--line);background:radial-gradient(circle,var(--card) 60%,var(--soft));transition:transform .15s linear,border-color .3s}
.cmp.ok{border-color:var(--ok);box-shadow:0 0 0 6px rgba(47,125,85,.2)}
.cn{position:absolute;top:50%;left:50%;width:36px;height:24px;margin:-12px 0 0 -18px;text-align:center;font-weight:800;color:var(--muted);transform:rotate(var(--a)) translateY(-104px) rotate(calc(-1*var(--a)))}
.cmp-t{position:absolute;inset:0}
.cmp-arrow{position:absolute;top:14px;left:50%;transform:translateX(-50%);font-size:2rem;background:var(--gold-soft);border:2px solid var(--acc);border-radius:50%;width:54px;height:54px;display:flex;align-items:center;justify-content:center}
.cmp-t::after{content:'';position:absolute;top:70px;left:50%;width:4px;height:56px;margin-left:-2px;background:var(--acc);border-radius:2px}
.thl{aspect-ratio:1;border-radius:8px;border:1px solid var(--line);background:var(--card);font-size:.85rem;display:flex;align-items:center;justify-content:center;text-decoration:none;color:var(--ink);font-weight:700}
.thl.on{background:var(--ok);color:#fff;border-color:var(--ok)}
.pbar{height:12px;background:var(--soft);border-radius:999px;overflow:hidden}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),#4caf7d);border-radius:999px;transition:width .4s}
.th button.d{background:var(--ok);color:#fff;border-color:var(--ok)}
.th button.t{background:#e9c46a;color:#3a2c00;border-color:#e9c46a}
.th button.m{background:var(--pri2);color:#fff;border-color:var(--pri2)}
.th button:disabled{cursor:default}
.thtext{font-family:'Frank Ruhl Libre',serif;font-size:1.3rem;line-height:1.9;margin:10px 0}
.thtext p{margin:0 0 8px}.vn{color:var(--acc);font-weight:700;font-size:.85rem;font-family:'Assistant',sans-serif}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:10px;height:16px;border-radius:2px;animation:fall 3.2s ease-in forwards}
@keyframes fall{to{top:110%;transform:rotate(720deg) translateX(40px)}}
.ic{display:block;width:58px;height:58px;object-fit:contain;filter:drop-shadow(0 2px 3px rgba(0,0,0,.15))}
.ic.nv{width:30px;height:30px;filter:none}.ic.sm{width:24px;height:24px;filter:none}.ic.md{width:34px;height:34px}.ic.fill{width:80%;height:80%}
.qa .em{min-height:58px;display:flex;align-items:center;justify-content:center}
.nav button .em{height:30px;display:flex;align-items:center;justify-content:center}
.hero.empty .ic.fill{width:120px;height:120px}
#ytFab{position:fixed;left:14px;bottom:96px;z-index:40;width:54px;height:54px;border-radius:50%;line-height:0;box-shadow:0 4px 14px rgba(0,0,0,.35);animation:ytp 2.4s ease-in-out infinite;touch-action:none}
#ytFab.drag{animation:none;opacity:.85}#ytFab{transition:opacity .6s,left .25s}#ytFab.dim{opacity:.4;animation:none}#ytFab.drag{transition:none}#ytFab.edge{animation:none}
@keyframes ytp{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
body.noyt #ytFab,body.nomotion #ytFab{animation:none}body.noyt #ytFab{display:none}
.yt-card{display:flex;align-items:center;gap:14px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-decoration:none;margin-bottom:12px;box-shadow:var(--sh)}
.yt-card b{font-size:1rem;display:block}.yt-card span{color:var(--muted);font-size:.85rem}
footer a{color:var(--muted)}
.tmctl{grid-column:1/-1;display:flex;gap:6px;align-items:center;flex-wrap:wrap}.tmctl select{flex:1 1 150px}.tmctl input{flex:0 0 110px}.tmprev{font-size:.85rem}
.ed2 .tmctl{grid-column:1/-1}
.hlogo{width:48px;height:48px;object-fit:contain;flex:none;filter:drop-shadow(0 2px 4px rgba(0,0,0,.3))}
.nav button{font-size:.72rem}.nav-tk{color:#8a6a10!important}.nav-tk.on{color:var(--acc)!important}
.tk-pills{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:4px 0 8px}
.tk-pills button{min-width:44px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:800;font-family:'Frank Ruhl Libre',serif;cursor:pointer}
.tk-pills button.done{background:var(--ok);color:#fff;border-color:var(--ok)}
.tk-body{font-family:'Frank Ruhl Libre',serif;font-size:1.25rem;line-height:1.95}
.tk-body p{margin:0 0 8px}.tk-body small{color:var(--acc);font-family:'Assistant',sans-serif;font-size:.7em;font-weight:700}
.tk-h{font-size:1.05rem;color:var(--pri);margin:6px 0}
.tk-ps{scroll-margin-top:130px;padding-bottom:6px;border-bottom:1px solid var(--line);margin-bottom:10px}
.tk-psh{display:flex;justify-content:space-between;align-items:center;position:sticky;top:120px;background:var(--card);padding:4px 0;z-index:1}
.tk-psh h3{margin:0;color:var(--pri);font-size:1.15rem}
.tk-ck{font-family:'Assistant',sans-serif;font-size:.95rem;font-weight:700;display:flex;align-items:center;gap:6px;background:var(--soft);border-radius:999px;padding:4px 12px;cursor:pointer}
.tk-ck input{width:20px;height:20px}
.missbar{display:block;width:100%;border:0;background:#f6a04d;color:#2a1600;font:inherit;font-size:.88rem;padding:8px 14px;text-align:right;cursor:pointer}
.zm-hero{background:linear-gradient(135deg,#16294a,#2f5585);color:#fff;border-radius:22px;padding:14px 14px 12px;box-shadow:0 8px 22px rgba(20,40,70,.3)}
.zm-hd{display:flex;align-items:center;gap:8px}.zm-nav{background:rgba(255,255,255,.14);border:0;color:#fff;width:44px;height:44px;border-radius:12px;font-size:1.6rem;font-weight:800;cursor:pointer}
.zm-h1{font-family:'Frank Ruhl Libre',serif;font-size:1.6rem;font-weight:700;color:#f3d78e}.zm-h2{font-size:.9rem;opacity:.85}
.zm-tags{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:8px}.zm-tags span{background:rgba(255,255,255,.14);border-radius:999px;padding:3px 10px;font-size:.85rem;font-weight:700}
.zm-next{display:flex;align-items:center;gap:10px;justify-content:center;flex-wrap:wrap;background:rgba(0,0,0,.2);border-radius:14px;padding:10px;margin-top:10px}.zm-next .zm-nt{font-size:1.5rem;font-weight:800;color:#f3d78e}
.zm-loc{text-align:center;font-size:.82rem;opacity:.9;margin-top:8px}.zm-lnk{background:none;border:0;color:#f3d78e;text-decoration:underline;font:inherit;cursor:pointer;padding:0}
.zm-sp{display:flex;align-items:center;gap:12px}.zm-spi{font-size:1.8rem}
.zm-sec h3{display:flex;gap:6px;align-items:center}.zm-row.zm-on{background:var(--gold-soft);margin:0 -14px;padding:11px 14px;border-radius:10px}
.sh-cv{width:100%;border-radius:14px;box-shadow:0 4px 16px rgba(0,0,0,.2);margin-top:6px}
.swt{display:inline-block;width:14px;height:14px;border-radius:50%;margin-inline-end:6px;vertical-align:-2px;border:1px solid rgba(0,0,0,.2)}
.mol-ann{font-family:'Frank Ruhl Libre',serif;font-size:1.15rem;line-height:1.6;background:var(--soft);border-radius:12px;padding:10px 12px;margin-bottom:6px}
footer{text-align:center;color:var(--muted);font-size:.8rem;padding:10px 0 20px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>

<script type="application/json" id="tkdata">{"id": "tikkun", "short": "תִּקּוּן הַכְּלָלִי", "name": "", "g": "tikkun", "c": [{"t": "תִּקּוּן הַכְּלָלִי", "i": [{"n": "", "p": 594, "b": [["h", "קוֹדֵם שֶׁיַתְחִיל בַּאֲמִירַת תְּהִלִּים יֹאמַר זֶה:"], ["p", "<b>לְכוּ<\/b> נְרַנְּנָה לַיהֹוָה, נָרִיעָה לְצוּר יִשְׁעֵנוּ: נְקַדְּמָה פָּנָיו בְּתוֹדָה, בִּזְמִרוֹת נָרִיעַ לוֹ: כִּי אֵל גָּדוֹל יְהֹוָה, וּמֶלֶךְ גָּדוֹל עַל כָּל אֱלֹהִים: <b>הֲרֵינִי<\/b> מְזַמֵּן אֶת פִּי לְהוֹדוֹת וּלְהַלֵּל וּלְשַׁבֵּחַ אֶת בּוֹרְאִי. לְשֵׁם יִחוּד קֻדְשָׁא בְּרִיךְ הוּא וּשְׁכִינְתֵּה בִּדְחִילוּ וּרְחִימוּ עַל־יְדֵי הַהוּא טָמִיר וְנֶעְלָם בְּשֵׁם כָּל יִשְׂרָאֵל:"]]}, {"n": "", "p": 594, "b": [["h", "טוֹב לוֹמַר זֹאת לִפְנֵי אֲמִירַת הָעֲשָׂרָה מִזְמוֹרִים"], ["p", "<b>הֲרֵינִי<\/b> מְקַשֵׁר עַצְמִי בַּאֲמִירַת הָעֲשָׂרָה מִזְמוֹרֵי תְּהִלִּים אֵלּוּ לְכָל הַצַּדִּיקִים הָאֲמִתִּיִּים שֶׁבְּדוֹרֵנוּ, וּלְכָל הַצַּדִּיקִים הָאֲמִתִּים שׁוֹכְנֵי עָפָר קְדוֹשִׁים אָשֵׁר בָּאָרֶץ הֵמָּה, וּבִפְרָט לְרַבֵּנוּ הַקָּדוֹשׁ צַדִּיק יְסוֹד עוֹלָם נַחַל נוֹבֵעַ מְקוֹר חָכְמָה, רַבֵּנוּ נַחְמָן בֶּן פֵיגֶא בֶּן שִׂמְחָה, זְכוּתָם יָגֵן עָלֵינוּ וְעַל כָּל יִשְׂרָאֵל, אָמֵן."]]}, {"n": "", "p": 594, "b": [["p", "<b>וְעַל<\/b> דַּעְתָּם וְעַל כַּוָּנָתָם אֲנִי אוֹמֵר הָעֲשָׂרָה קַפִּיטְל תְּהִלִּים אֵלּוּ, וּבִזְכוּתָם וְכֹחָם אֶזְכֶּה לְעוֹרֵר וּלְגַלּוֹת כָּל הָעֲשָׂרָה מִינֵי נְגִינָה שֶׁנֶּאֱמַר בָּהֶם סֵפֶר תְּהִלִּים, שֶׁהֵם: אַשְׁרֵי, בְּרָכָה, מַשְׂכִּיל, שִׁיר, נִצּוּחַ, נִגּוּן, תְּפִלָּה, הוֹדָאָה, מִזְמוֹר, הַלְלוּיָהּ, שֶׁהֵם: שִׁיר פָּשׁוּט, כָּפוּל, מְשֻׁלָּש, מְרֻבָּע, שֶׁהֵם כְּלוּלִים בְּשִׁמְךָ הַמְיֻחָד הַגָּדוֹל וְהַקָדוֹשׁ. וּבִזְכוּת וְכֹחַ הַשְׁנֵי שְׁמוֹת הַקְּדוֹשִׁים הָאֵלּוּ בְּמִלּוּאָם, שֶׁהֵם אֵל אֱלֹהִים (כָּזֶה) : אָלֶף לָמֶד, אָלֶף לָמֶד הֵי יוֹד מֵם, שֶׁהֵם עוֹלִים בְּמִסְפָּר תפ\"ה, כְּמִסְפַּר תְּהִלִּים, בְּכֹחַ אֵלוּ הַשֵּׁמוֹת תְּזַכֵּנִי לְתִקּוּן הַבְּרִית שֶׁהוּא תִּקּוּן הַכְּלָלִי, אָמֵן:"]]}, {"n": "טז", "p": 595, "b": [["p", "<small>א<\/small> מִכְת ל וְכִנּוֹר:"], ["p", "<small>ד<\/small> הַלְלוּהוּ בְּתֹף וּמָחוֹל, הַלְלוּהוּ בְּמִנִּים וְעוּגָב:"], ["p", "<small>ה<\/small> הַלְלוּהוּ בְצִלְצְלֵי שָׁמַע, הַלְלוּהוּ בְּצִלְצְלֵי תְרוּעָה:"], ["p", "<small>ו<\/small> כֹּל הַנְּשָׁמָה תְּהַלֵּל יָהּ, הַלְלוּיָהּ:"], ["h", "<small>לאחר סיום המזמורים יאמר שלושה פסוקים אלו:<\/small>"], ["p", "<b>מִי<\/b> יִתֵּן מִצִּיּוֹן יְשׁוּעַת יִשְׂרָאֵל בְּשׁוּב יְהֹוָה שְׁבוּת עַמּוֹ, יָגֵל יַעֲקֹב יִשְׂמַח יִשְׂרָאֵל: וּתְשׁוּעַת צַדִּיקִים מֵיְהֹוָה, מָעוּזָּם בְּעֵת צָרָה: וַיַּעְזְרֵם יְהֹוָה וַיְפַלְּטֵם' יְפַלְּטֵם מֵרְשָׁעִים וְיוֹשִׁיעֵם כִּי חָסוּ בוֹ:"], ["fold", "<div class=\"fold-sub\">תְּפִלָּה לְאַחַר הַתִּקּוּן הַכְּלָלִי – מִמּוֹרֵנוּ רַבִּי נָתָן זַצַ״ל<\/div><p class=\"ins\">אחר כך טוב לומר את התפילה הזו, שחיבר מורנו רבי נתן זצ״ל:<\/p><p><b>אָשִׁירָה<\/b> לַיהֹוָה בְּחַיָּי, אֲזַמְּרָה לֵאלֹהַי בְּעוֹדִי, יֶעֱרַב עָלָיו שִׂיחִי אָנֹכִי אֶשְׂמַח בַּיהֹוָה: הוֹדוּ לַיהֹוָה בְּכִנּוֹר, בְּנֵבֶל עָשׂוֹר זַמְּרוּ לוֹ: אֱלֹהִים, שִׁיר חָדָשׁ אָשִׁירָה לָּךְ, בְּנֵבֶל עָשׂוֹר אֲזַמְּרָה לָּךְ: עֲלֵי עָשׂוֹר וַעֲלֵי נָבֶל, עֲלֵי הִגָּיוֹן בְּכִנּוֹר: כִּי שִׂמַּחְתַּנִי יְהֹוָה בְּפָעֳלֶךָ, בְּמַעֲשֵׂי יָדֶיךָ אֲרַנֵּן:<\/p><p><b>רִבּוֹנוֹ<\/b> שֶׁל עוֹלָם, אֲדוֹן כֹּל, בּוֹרֵא כָּל הַנְּשָׁמוֹת, רִבּוֹן כָּל הַמַּעֲשִׂים, הַבּוֹחֵר בְּשִׁירֵי זִמְרָה, עָזְרֵנִי וְחָנֵּנִי בְּרַחֲמֶיךָ הָרַבִּים וּבַחֲסָדֶיךָ הָעֲצוּמִים, שֶׁאֶזְכֶּה לְעוֹרֵר וּלְהוֹצִיא וּלְגַלּוֹת כָּל הָעֲשָׂרָה מִינֵי נְגִינָה שֶׁנֶּאֱמַר בָּהֶם סֵפֶר תְּהִלִּים. וּבִזְכוּת אֵלּוּ הָעֲשָׂרָה קַפִּיטְל תְּהִלִּים שֶׁאָמַרְתִּי לְפָנֶיךָ, שֶׁהֵם כְּנֶגֶד עֲשָׂרָה מִינֵי נְגִינָה, שֶׁנֶּאֱמַר בָּהֶם סֵפֶר תְּהִלִּים, שֶׁהֵם: <b>אַשְׁרֵי, בְּרָכָה, מַשְׂכִּיל, שִׁיר, נִצּוּחַ, נִגּוּן, תְּפִלָּה,<\/b> <b>הוֹדָאָה, מִזְמוֹר, הַלְלוּיָהּ:<\/b> בִּזְכוּת הַמִּזְמוֹרִים וּבִזְכוּת הַפְּסוּקִים וּבִזְכוּת תֵּבוֹתֵיהֶם וְאוֹתִיּוֹתֵיהֶם וּנְקֻדּוֹתֵיהֶם וְטַעֲמֵיהֶם וְהַשֵּׁמוֹת הַיּוֹצְאִים מֵהֶם מֵרָאשֵׁי תֵּבוֹת וּמִסּוֹפֵי תֵּבוֹת, וּבִזְכוּת דָּוִד הַמֶּלֶךְ, עָלָיו הַשָּׁלוֹם, עִם כָּל הָעֲשָׂרָה צַדִּיקִים, שֶׁיָּסְדוּ סֵפֶר תְּהִלִּים וּבִזְכוּת הַצַּדִּיק יְסוֹד עוֹלָם, נַחַל נוֹבֵעַ מְקוֹר חָכְמָה, רַבֵּנוּ נַחְמָן בֶּן פֵיגֶא, <b>נַ נַחְ נַחְמָ<\/b> <b>נַחְמָן מְאוּמָן<\/b> זְכוּתוֹ יָגֵן עָלֵינוּ, אֲשֶׁר גִּלָּה וְתִקֵּן לוֹמַר אֵלּוּ הָעֲשָׂרָה קַפִּיטְל תְּהִלִּים בִּשְׁבִיל תִּקּוּן הַבְּרִית, וּבִזְכוּת כָּל הַצַּדִּיקִים וְהַחֲסִידִים הָאֲמִתִּיִּים, תְּזַכֵּנִי וּתְחָנֵּנִי, שֶׁאֶזְכֶּה בְּרַחֲמֶיךָ הָרַבִּים לְהוֹצִיא כָּל הַטִּפּוֹת קֶרִי, שֶׁיָּצְאוּ מִמֶּנִּי לְבַטָּלָה, בֵּין בְּשׁוֹגֵג בֵּין בְּמֵזִיד, בֵּין בְּאֹנֶס בֵּין בְּרָצוֹן,<\/p><p class=\"ins\">(אם אומר את התפילה, חס ושלום, בשביל מקרה שאירע לו באותו הלילה, יוסיף:<\/p><p>וּבִפְרָט כָּל הַטִּפּוֹת שֶׁיָּצְאוּ מִמֶּנִּי בְּלַיְלָה זֶה עַל־יְדֵי מִקְרֵה לַיְלָה, שֶׁקָּרָה לִי בַּעֲווֹנוֹתַי הָרַבִּים), כֻּלָּם אֶזְכֶּה, בְּרַחֲמֶיךָ הָרַבִּים וּבְחֶמְלָתְךָ הַגְּדוֹלָה וּבְכֹחֲךָ הַגָּדוֹל לְהוֹצִיאָם מֵהַקְּלִפּוֹת וּמֵהַסִּטְרִין אָחֳרָנִין, מִכָּל הַמְּקוֹמוֹת שֶׁנָּפְלוּ וְנִתְפַּזְּרוּ וְנָפוֹצוּ וְנִדְּחוּ לְשָׁם, וְאַל יִדַּח מִמְּךָ נִדָּח. וְתַכְנִיעַ וּתְשַׁבֵּר וְתַהֲרֹג וּתְעַקֵּר וּתְכַלֶּה וּתְבַטֵּל כָּל הַקְּלִפּוֹת וְכָל הָרוּחִין וְשֵׁדִין וְלִילִין, שֶׁנַּעֲשׂוּ וְנִבְרְאוּ וְנוֹצְרוּ עַל־יְדֵי אֵלּוּ הַטִּפּוֹת, שֶׁיָּצְאוּ מִמֶּנִּי לְבַטָּלָה, וְתָסִיר מֵהֶם חִיּוּתָם, וְתוֹצִיא וְתִגְזֹל מֵהֶם הַחִיּוּת דִּקְדֻשָּׁה, וְכָל הַנִּיצוֹצוֹת הַקְּדוֹשִׁים שֶׁבָּלְעוּ:<\/p><p><b>רִבּוֹנוֹ<\/b> שֶׁל עוֹלָם! אֵל חַי וְקַיָּם, חַי הַחַיִּים, מָלֵא רַחֲמִים, הַדָּן אֶת כָּל הָעוֹלָם לְכַף זְכוּת תָּמִיד, הֶחָפֵץ חֶסֶד וּמַרְבֶּה לְהֵיטִיב. אָבִי אָבִי, גּוֹאֲלִי וּפוֹדִי. יָדַעְתִּי יְהֹוָה יָדַעְתִּי, כִּי אֲנִי בְּעַצְמִי הַחַיָּב וְהַפּוֹשֵׁעַ אֲפִלּוּ בְּהַמִּקְרוֹת שֶׁנִּזְדַּמְּנוּ לִי בְּשׁוֹגֵג, כִּי לֹא שָׁמַרְתִּי אֶת הַמַּחֲשָׁבָה כְּלָל וְהִרְהַרְתִּי בַּיּוֹם, עַד שֶׁבָּאתִי לִידֵי טֻמְאָה בַּלַּיְלָה, וְעַל־יְדֵי־זֶה קִלְקַלְתִּי מַה שֶּׁקִּלְקַלְתִּי, וְגָרַמְתִּי מַה שֶּׁגָּרַמְתִּי, וְשִׁחַתְתִּי מַה שֶּׁשִּׁחַתְתִּי. אוֹי אוֹי אוֹי, אוֹיָה עַל נַפְשִׁי, אוֹי לְנַפְשִׁי, כִּי גָּמַלְתִּי לִי רָעָה. מָה אֹמַר, מָה אֲדַבֵּר, מָה אֶצְטַדָּק. מָה אֹמַר, מָה אֲדַבֵּר, מָה אֶצְטַדָּק. הָאֱלֹהִים מָצָא אֶת עֲווֹנִי. הִנְנִי לְפָנֶיךָ בְּאַשְׁמָה רַבָּה, הִנְנִי לְפָנֶיךָ מָלֵא בּוּשָׁה וּכְלִמָּה, מָלֵא טִנּוּפִים וְלִכְלוּכִים, מָלֵא תּוֹעֵבוֹת רָעוֹת, וְאֵין שׁוּם לָשׁוֹן בָּעוֹלָם שֶׁאוּכַל לְכַנּוֹת בּוֹ עֹצֶם הָרַחֲמָנוּת שֶׁיֵּשׁ עָלַי, כִּי רַע וָמַר, כִּי נָגַע עַד הַנֶּפֶשׁ, מַר לִי מְאֹד, אָבִי שֶׁבַּשָּׁמַיִם; מַר לִי מְאֹד, רִבּוֹן כָּל הָעוֹלָמִים. רְאֵה אַנְחָתִי וְאֶנְקָתִי, כִּי נַפְשִׁי מָרָה לִי מְאֹד, עַד אֲשֶׁר אֵינִי יוֹדֵעַ אֵיךְ אֲנִי יָכוֹל לִחְיוֹת מֵעֹצֶם מְרִירוּת נַפְשִׁי, אֲשֶׁר עַד גָּבְהֵי שָׁמַיִם יַגִּיעַ, כִּי קַצְתִּי בְּחַיַּי, לָמָּה לִי חַיִּים כָּאֵלֶּה, חַיִּים מָרִים וּמְרוּרִים מִמָּוֶת. אֶת קֻבַּעַת כּוֹס הַתַּרְעֵלָה שָׁתִית, מָצִית, נַפְשִׁי:<\/p><p><b>רִבּוֹנוֹ<\/b> שֶׁל עוֹלָם! אַתָּה לְבַד יָדַעְתָּ רִבּוּי וְעֹצֶם הַפְּגָמִים הַגְּדוֹלִים, הָעֲצוּמִים וְהַנּוֹרָאִים, שֶׁנַּעֲשִׂים עַל־יְדֵי־זֶה בְּכָל הָעוֹלָמוֹת, וְעַתָּה אֵיךְ אוּכַל לְתַקֵּן זֹאת וּבַמֶּה יִזְכֶּה נַעַר כָּמוֹנִי לְתַקֵּן אֶת אֲשֶׁר שִׁחַתְתִּי. אַךְ אַף־עַל־פִּי־כֵן יָדַעְתִּי, וַאֲנִי מַאֲמִין בֶּאֱמוּנָה שְׁלֵמָה, כִּי אֵין שׁוּם יֵאוּשׁ בָּעוֹלָם כְּלָל, וַעֲדַיִן יֵשׁ לִי תִּקְוָה, וַעֲדַיִן לֹא אָבְדָה תּוֹחַלְתִּי מֵיְהֹוָה, כִּי חַסְדֵּי יְהֹוָה כִּי לֹא תָמְנוּ, כִּי לֹא כָלוּ רַחֲמָיו:<\/p><p><b>עַל־כֵּן<\/b> בָּאתִי לְפָנֶיךָ, יְהֹוָה אֱלֹהַי וֵאלֹהֵי אֲבוֹתַי, אֱלֹהֵי אַבְרָהָם, אֱלֹהֵי יִצְחָק וֵאלֹהֵי יַעֲקֹב, אֱלֹהֵי כָּל הַצַּדִּיקִים וְהַחֲסִידִים הָאֲמִתִּיִּים וֵאלֹהֵי כָּל יִשְׂרָאֵל, אֱלֹהֵי הָרִאשׁוֹנִים וְהָאַחֲרוֹנִים, שֶׁתְּרַחֵם עָלַי וְתַעֲשֶׂה אֶת אֲשֶׁר בְּחֻקֶּיךָ אֵלֵךְ וְאֶת מִשְׁפָּטֶיךָ אֶשְׁמֹר, וְתָכֹף אֶת יִצְרִי לְהִשְׁתַּעְבֶּד לָּךְ, וְתִגְעַר בְּהַיֵּצֶר הָרָע וּתְגָרְשׁוֹ מִמֶּנִּי מֵעַתָּה וְעַד עוֹלָם, וְתִשְׁמְרֵנִי וְתַצִּילֵנִי וּתְפַלְּטֵנִי מֵעַתָּה מִכָּל מִינֵי הִרְהוּרִים רָעִים וּמִמַּחֲשָׁבוֹת רָעוֹת וּמִפְּגַם הָרְאוּת וּמִפְּגַם הַדִּבּוּר, וְתַצִּילֵנִי מֵעַתָּה מִכָּל מִינֵי פְּגַם הַבְּרִית שֶׁבָּעוֹלָם בְּמַחֲשָׁבָה דִּבּוּר וּמַעֲשֶׂה, וְתִהְיֶה עִמִּי תָּמִיד וְתִשְׁמְרֵנִי וְתַצִּילֵנִי מִמִּקְרֶה, בֵּין בַּיּוֹם וּבֵין בַּלַּיְלָה מֵעַתָּה וְעַד עוֹלָם:<\/p><p><b>אָבִינוּ<\/b>, מֶלֶךְ אֵל חַי וְקַיָּם, גּוֹאֵל חָזָק. שִׁטַּחְתִּי אֵלֶיךָ כַפָּי. הַצֵּל הַצֵּל, הוֹשִׁיעָה הוֹשִׁיעָה, הַצֵּל לְקוּחִים לַמָּוֶת, הַצֵּל נִרְדָּף וְחַיָּב כָּמוֹנִי, הַצִּילֵנִי מִן הַשְּׁאוֹל תַּחְתִּיּוֹת. תֶּן לִי תִּקְוָה וְלֹא אֹבַד, חַס וְשָׁלוֹם, כִּי מַה בֶּצַע בְּדָמִי, בְּרִדְתִּי אֶל שַׁחַת, הֲיוֹדְךָ עָפָר, הֲיַגִּיד אֲמִתֶּךָ. דָלוּ עֵינַי לַמָּרוֹם, יְהֹוָה עָשְׁקָה לִי, עָרְבֵנִי, עֲרֹב עַבְדְּךָ לְטוֹב, אַל יַעַשְׁקֻנִי זֵדִים. כִּי אֵין לִי שׁוּם כֹּחַ אֶלָּא בְּפִי, אֵין לִי שׁוּם מָנוֹס וּמִבְטָח, כִּי אִם עָלֶיךָ לְבַד, עַל חֲסָדֶיךָ הָעֲצוּמִים לְבַד, עַל רַחֲמֶיךָ הַגְּדוֹלִים, עַל חֶמְלָתְךָ הָאֲמִתִּית, עַל חֲנִינוֹתֶיךָ הַנִּצְחִיּוֹת וְעַל כֹּחַ וּזְכוּת הַצַּדִּיקִים, שֶׁשָּׁמְרוּ אֶת הַבְּרִית בְּתַכְלִית הַשְּׁלֵמוּת, שֶׁאֵין שְׁלֵמוּת אַחֲרָיו, בָּהֶם תָּמַכְתִּי יְתֵדוֹתַי, בָּהֶם אֶשָּׁעֵן וְאֶסָּמֵךְ, בִּזְכוּתָם וְכֹחָם אֶבְטַח וַאֲקַוֶּה, כִּי לֹא תַעֲזֹב נַפְשִׁי לִשְׁאוֹל, לֹא תִתֵּן חֲסִידְךָ לִרְאוֹת שָׁחַת. אֲהָהּ יְהֹוָה, מַלְּטֵנִי! אֲהָהּ יְהֹוָה, פְּדֵנִי! רְאֵה מְסֻכָּן כָּמוֹנִי טוֹרֵף בְּלֵב יַמִּים, תְּהוֹם אֶל תְּהוֹם קוֹרֵא לְקוֹל צִנּוֹרֶיךָ, כָּל מִשְׁבָּרֶיךָ וְגַלֶּיךָ עָלַי עָבָרוּ. צוֹד צָדוּנִי כַּצִּפּוֹר, אֹיְבַי חִנָּם. צָמְתוּ בַבּוֹר חַיָּי, וַיַּדּוּ אֶבֶן בִּי. צָפוּ מַיִם עַל רֹאשִׁי, אָמַרְתִּי נִגְזָרְתִּי. קָרָאתִי שִׁמְךָ יְהֹוָה, מִבּוֹר תַּחְתִּיּוֹת; קָרָאתִי שִׁמְךָ יְהֹוָה מִבּוֹר תַּחְתִּיּוֹת:<\/p><p><b>רִבּוֹנוֹ<\/b> שֶׁל עוֹלָם! רִבּוֹנוֹ שֶׁל עוֹלָם! מָלֵא רַחֲמִים, מָלֵא חֶסֶד חִנָּם, מָלֵא חֲנִינוֹת, מָלֵא רַחֲמָנוּת, מָלֵא טוֹב, מָלֵא רָצוֹן. כְּבָר קִבַּלְנוּ עָלֵינוּ לִקְרֹא אֵלֶיךָ תָּמִיד, וְהִנְנִי מְקַיֵּם קַבָּלָתֵנוּ, וְהִנְנִי קוֹרֵא אֵלֶיךָ מִמָּקוֹם שָׁפָל כָּזֶה, מִמְּקוֹמוֹת מְגֻנִּים כָּאֵלֶּה. מִמַּעֲמַקִּים קְרָאתִיךָ יְהֹוָה, מֵעִמְקֵי עֲמָקִים, מִן הַמֵּצַר קָרָאתִי יָהּ, עָנָנִי בַמֶּרְחָב יָהּ. וְאִם בַּעֲווֹנוֹתֵינוּ הָרַבִּים יָרַדְנוּ לְמָקוֹם שֶׁיָּרַדְנוּ, וְיָרַדְנוּ עַכְשָׁו בְּעִקְבוֹת מְשִׁיחָא לִמְקוֹמוֹת נְמוּכִים וּשְׁפָלִים מְאֹד מְאֹד, שֶׁלֹּא יָרְדוּ יִשְׂרָאֵל לְתוֹכָם מֵעוֹלָם, כְּמוֹ שֶׁכָּתוּב: וַתֵּרֶד פְּלָאִים, אֵין מְנַחֵם לָהּ; אַף־עַל־פִּי־כֵן אֵין אָנוּ מְיָאֲשִׁים עַצְמֵנוּ, חַס וְשָׁלוֹם, בְּשׁוּם אֹפֶן בָּעוֹלָם כְּלָל, כִּי כְּבָר הִבְטַחְתָּנוּ לַהֲשִׁיבֵנוּ מִמְּצוּלוֹת יָם, כְּמוֹ שֶׁכָּתוּב: אָמַר אֲדֹנָי מִבָּשָׁן אָשִׁיב, אָשִׁיב מִמְּצוּלוֹת יָם. וּכְתִיב: וְאַף גַּם זֹאת, בִּהְיוֹתָם בְּאֶרֶץ אֹיְבֵיהֶם לֹא מְאַסְתִּים וְלֹא גְעַלְתִּים לְכַלֹּתָם לְהָפֵר בְּרִיתִי אִתָּם, כִּי אֲנִי יְהֹוָה אֱלֹהֵיהֶם:<\/p><p><b>רִבּוֹנוֹ<\/b> שֶׁל עוֹלָם! פְּתַח פִּיךָ לְאִלֵּם כָּמוֹנִי, וְתִשְׁלַח לִי דִּבּוּרִים מִמְּעוֹן קָדְשְׁךָ מִן הַשָּׁמַיִם, בְּאֹפֶן שֶׁאוּכַל לְנַצֵּחַ אוֹתְךָ, לְרַצּוֹת וּלְפַיֵּס אוֹתְךָ, שֶׁתְּקַבֵּל בְּרַחֲמֶיךָ הָרַבִּים וּבַחֲסָדֶיךָ הָעֲצוּמִים אֶת אֵלּוּ הָעֲשָׂרָה קַפִּיטְל תְּהִלִּים שֶׁאָמַרְתִּי לְפָנֶיךָ, כְּאִלּוּ אֲמָרָם דָּוִד הַמֶּלֶךְ עָלָיו הַשָּׁלוֹם בְּעַצְמוֹ, וְאַף־עַל־פִּי שֶׁאֵינִי יוֹדֵעַ לְכַוֵּן שׁוּם כַּוָּנָה מֵהַכַּוָּנוֹת הָעֲצוּמוֹת וְהַנּוֹרָאוֹת, שֶׁיֵּשׁ בְּאֵלּוּ הָעֲשָׂרָה מִזְמוֹרִים, יְהִי רָצוֹן מִלְּפָנֶיךָ, יְהֹוָה אֱלֹהַי וֵאלֹהֵי אֲבוֹתַי, שֶׁתְּהֵא חֲשׁוּבָה לְפָנֶיךָ הָאֲמִירָה בַּפֶּה לְבַד, כְּאִלּוּ הִשַּׂגְתִּי וְכִוַּנְתִּי כָּל הַסּוֹדוֹת וְהַכַּוָּנוֹת שֶׁיֵּשׁ בָּהֶם, וְיִהְיוּ אֲמָרַי לְרָצוֹן לִפְנֵי אֲדוֹן כֹּל. וְהִנְנִי מַשְׁלִיךְ יְהָבִי עָלֶיךָ, וְהִנְנִי מְקַשֵּׁר עַצְמִי לְכָל הַצַּדִּיקִים הָאֲמִתִּיִּים שֶׁבְּדוֹרֵנוּ וּלְכָל הַצַּדִּיקִים הָאֲמִתִּיִּים, שׁוֹכְנֵי עָפָר, קְדוֹשִׁים אֲשֶׁר בָּאָרֶץ הֵמָּה, וּבִפְרָט לְהַצַּדִּיק יְסוֹד עוֹלָם, נַחַל נוֹבֵעַ מְקוֹר חָכְמָה, רַבֵּנוּ נַחְמָן בֶּן פֵיגֶא, <b>נַ נַחְ נַחְמָ נַחְמָן מאומן,<\/b> זְכוּתוֹ יָגֵן עָלֵינוּ אָמֵן, וְעַל דַּעְתָּם וְעַל כַּוָּנָתָם אָמַרְתִּי כָּל אֵלּוּ הָעֲשָׂרָה קַפִּיטְל תְּהִלִּים, וּבִזְכוּתָם וְכֹחָם אֶזְכֶּה לְעוֹרֵר וּלְגַלּוֹת כָּל הָעֲשָׂרָה מִינֵי נְגִינָה, שֶׁנֶּאֱמַר בָּהֶם סֵפֶר תְּהִלִּים, שֶׁהֵם: שִׁיר פָּשׁוּט, כָּפוּל, מְשֻׁלָּשׁ, מְרֻבָּע, שֶׁהֵם כְּלוּלִים בְּשִׁמְךָ הַמְּיֻחָד, הַגָּדוֹל וְהַקָּדוֹשׁ וּבִזְכוּת וְכֹחַ הַשְּׁנֵי שֵׁמוֹת הַקְּדוֹשִׁים הָאֵלּוּ בְּמִלּוּאָם, שֶׁהֵם \"אֵל אֱלֹהִים\" (כָּזֶה): אל\"ף למ\"ד, אל\"ף למ\"ד ה\"י יו\"ד מ\"ם, שֶׁהֵם עוֹלִים בְּמִסְפָּר תפ\"ה (אַרְבַּע מֵאוֹת שְׁמוֹנִים וְחָמֵשׁ), כְּמִסְפַּר תְּהִלִּים, בְּכֹחַ אֵלּוּ הַשֵּׁמוֹת תְּזַכֵּנִי לְהוֹצִיא כָּל הַטִּפּוֹת קֶרִי לְבַטָּלָה מִבֶּטֶן הַקְּלִפָּה שֶׁבְּלָעָם, אֲשֶׁר מִסְפַּר שְׁמָהּ עִם הָאוֹתִיּוֹת עוֹלֶה תפ\"ה, שֶׁהִיא בַּקְּלִפָּה כְּנֶגֶד קְדֻשַּׁת סֵפֶר תְּהִלִּים. וּבְכֹחַ אֵלּוּ הָעֲשָׂרָה מִזְמוֹרֵי תְּהִלִּים תְּעוֹרֵר הַשְּׁנֵי הַשֵּׁמוֹת הַקְּדוֹשִׁים \"אֵל אֱלֹהִים\", וְתַהֲרֹג, וּתְשַׁבֵּר וְתַכְנִיעַ, וּתְעַקֵּר וּתְכַלֶּה וּתְבַטֵּל אֶת הַקְּלִפָּה הַזֹּאת שֶׁבְּלָעָם, וְתַכְרִיחַ אוֹתָהּ לְהַפְלִיט כָּל הַטִּפּוֹת הַקְּדוֹשׁוֹת מִבִּטְנָהּ וְקִרְבָּהּ, וְתִמְחֶה שְׁמָהּ וְזִכְרָהּ מִן הָעוֹלָם, וּתְקַיֵּם מִקְרָא שֶׁכָּתוּב: חַיִל בָּלַע וַיְקִיאֶנּוּ, מִבִּטְנוֹ יוֹרִישֶׁנּוּ אֵל. וְתַהֲרֹג כָּל הַקְּלִפּוֹת, שֶׁנִּבְרְאוּ עַל־יְדֵי אֵלּוּ הַטִּפּוֹת, וְתוֹצִיא וְתִגְזֹל מֵהֶם הַחִיּוּת דִּקְדֻשָּׁה. וְכָל הַנִּיצוֹצוֹת הַקְּדוֹשׁוֹת שֶׁבָּלְעוּ עַל־יְדֵי פְּגַם חֵטְא זֶה, כֻּלָּם תּוֹצִיאֵם, וְתַחֲזֹר וּתְקַבְּצֵם בִּקְדֻשָּׁה שֵׁנִית, וּתְזַכֵּנוּ לְקַבֵּל עָלֵינוּ עֹל מַלְכוּת שָׁמַיִם בְּאַהֲבָה תָּמִיד, וְנִזְכֶּה לַעֲסֹק כָּל יָמֵינוּ בְּתוֹרָה וּתְפִלָּה וּמַעֲשִׂים טוֹבִים בֶּאֱמֶת וּבְלֵב שָׁלֵם, בְּאֹפֶן שֶׁנִּזְכֶּה לִבְרֹא גּוּפִים וְכֵלִים קְדוֹשִׁים לְכָל הַנְּשָׁמוֹת דְּאָזְלִין עַרְטִילָאִין עַל־יְדֵי עֲווֹנוֹתֵינוּ הָרַבִּים עַל־יְדֵי פְּגַם הַטִּפּוֹת קֶרִי, שֶׁיָּצְאוּ מִמֶּנִּי לְבַטָּלָה:<\/p><p><b>רִבּוֹנוֹ<\/b> שֶׁל עוֹלָם, אַמִּיץ כֹּחַ, וְרַב אוֹנִים! עֲשֵׂה מַה שֶּׁתַּעֲשֶׂה בְּרַחֲמֶיךָ הָרַבִּים בְּאֹפֶן שֶׁנִּזְכֶּה לְתַקֵּן פְּגַם הַבְּרִית, פְּגַם טִפֵּי הַמֹּחַ, בֵּין מַה שֶּׁפָּגַמְנוּ בָּזֶה בְּשׁוֹגֵג, בֵּין בְּמֵזִיד, בֵּין בְּאֹנֶס, בֵּין בְּרָצוֹן, עַל הַכֹּל תִּמְחַל וְתִסְלַח לִי, אֱלוֹהַּ סְלִיחוֹת, חַנּוּן הַמַּרְבֶּה לִסְלֹחַ, וְנִזְכֶּה לְתַקֵּן כָּל הַפְּגָמִים בִּשְׁלֵמוּת בְּחַיֵּינוּ בִּזְכוּת הַצַּדִּיקִים הַקְּדוֹשִׁים אֲשֶׁר בָּאָרֶץ הֵמָּה <small>(אם יהיה על קברו הקדוש יאמר:<\/small> וּבִזְכוּת הַצַּדִּיק הַזֶהּ הַשּׁוֹכֵן פֹּה, צַדִּיק יְסוֹד עוֹלָם נַחַל נוֹבֵעַ מְקוֹר חָכְמָה, <b>נַ נַחְ נַחְמָ נַחְמָן מאומן,<\/b> אֲשֶׁר אֲנִי מְכַתֵּת רַגְלַי וְטִלְטַלְתִּי עַצְמִי בְּטִלְטוּל הַקָּשֶׁה בִּשְׁבִיל לָבוֹא הֵנָּה לְהִשְׁתַּטֵּחַ עַל קֶבֶר הַצַּדִּיק הָאֱמֶת הַקָּדוֹשׁ הַזֶהּ אֲשֶׁר הִבְטִיחָנוּ בְּחַיָּיו הַקְּדוֹשִׁים, לַעֲמֹד בְּעֶזְרָתֵנוּ סֶלָה תָּמִיד, כְּשֶׁנָּבוֹא עַל קִבְרוֹ הַקָּדוֹשׁ וְנִתֵּן פְּרוּטָה לִצְדָקָה וְנֹאמַר אֵלּוּ הָעֲשָׂרָה קַפִּיטְל תְּהִלִּים. וְהִנֵּה עָשִׂיתִי מַה שֶּׁמֻּטָּל עָלַי, עֲשֵׂה מַה שֶּׁעָלֶיךָ), וּמְחַל לִי, וּסְלַח לִי, וְכַפֵּר לִי עַל כָּל הַחֲטָאִים וְהָעֲווֹנוֹת וְהַפְּשָׁעִים, שֶׁחָטָאתִי וְשֶׁעָוִיתִי וְשֶׁפָּשַׁעְתִּי לְפָנֶיךָ בִּרְמַ\"ח אֵיבָרַי וּשְׁסָ\"ה גִּידַי, בְּמַחֲשָׁבָה, דִּבּוּר וּמַעֲשֶׂה, וּבַחֲמִשָּׁה חוּשִׁים וּבִשְׁאָר כֹּחוֹת הַגּוּף, וּבִפְרָט מַה שֶּׁחָטָאתִי וּפָשַׁעְתִּי וּפָגַמְתִּי נֶגְדְּךָ בִּפְגַם הַבְּרִית, שֶׁהוּא כְּלַל כָּל הַתּוֹרָה כֻּלָּהּ, וְהָרַע בְּעֵינֶיךָ עָשִׂיתִי מִנְּעוּרַי עַד הַיּוֹם הַזֶהּ. עַל הַכֹּל תִּמְחַל וְתִסְלַח וּתְכַפֵּר, מָלֵא רַחֲמִים, וּתְמַלֵּא כָּל הַשֵּׁמוֹת שֶׁפָּגַמְתִּי בְּשִׁמְךָ הַגָּדוֹל. הֶרֶב כַּבְּסֵנִי מֵעֲוֹנִי, וּמֵחַטָּאתִי טַהֲרֵנִי. תְּחַטְּאֵנִי בְאֵזוֹב וְאֶטְהָר, תְּכַבְּסֵנִי, וּמִשֶּׁלֶג אַלְבִּין. תַּשְׁמִיעֵנִי שָׂשׂוֹן וְשִׂמְחָה, תָּגֵלְנָה עֲצָמוֹת דִּכִּיתָ. הַסְתֵּר פָּנֶיךָ מֵחֲטָאָי, וְכָל עֲוֹנוֹתַי מְחֵה. מְחֵה פְּשָׁעַי לְמַעַנְךָ, כָּאָמוּר: אָנֹכִי אָנֹכִי, הוּא מוֹחֶה פְשָׁעֶיךָ לְמַעֲנִי, וְחַטֹּאתֶיךָ לֹא אֶזְכּוֹר, וְתִמָּלֵא עָלַי בְּרַחֲמִים, וְתִהְיֶה בְּעֶזְרִי תָּמִיד בִּזְכוּת וְכֹחַ הַצַּדִּיקִים הָאֲמִתִּיִּים, וְתִשְׁמְרֵנִי וְתַצִּילֵנִי תָּמִיד, וְתִתֵּן לִי כֹּחַ לְהִתְגַּבֵּר עַל יִצְרִי וְלָכֹף וּלְשַׁבֵּר אֶת תַּאֲוָתִי, וְלֹא אֶפְגֹּם עוֹד מַה שֶּׁפָּגַמְתִּי, וְלֹא אֶעֱשֶׂה עוֹד הָרַע בְּעֵינֶיךָ, וְלֹא אָשׁוּב עוֹד לְכִסְלָה. אִם אָוֶן פָּעַלְתִּי לֹא אוֹסִיף, כִּי כְּבָר הִבְטַחְתָּנוּ, שֶׁגַּם עַל זֶה מוֹעִיל תְּפִלָּה וּבַקָּשָׁה לְהִנָּצֵל לְהַבָּא בְּרַחֲמֶיךָ הָאֲמִתִּיִּים, מִן הַיֵּצֶר הָרַע וְכַת דִּילֵהּ. <small>(אם יהיה על קברו יאמר:<\/small> וּבִפְרָט עַל מְקוֹם צִיּוּן הַקָּדוֹשׁ הַזֶהּ, עָזְרֵנִי בִּזְכוּת הַצַּדִּיקִים הַגְּנוּזִים פֹּה) וְרַחֵם עָלַי, וְתֶן לִי כֹּחַ וּגְבוּרָה מֵאִתְּךָ, שֶׁאֶזְכֶּה לְהִתְגַּבֵּר וְלִכְבֹּשׁ אֶת יִצְרִי תָּמִיד, עַד שֶׁאֶזְכֶּה בְּרַחֲמֶיךָ לְגָרְשׁוֹ וּלְסַלְּקוֹ וּלְבַטְּלוֹ מֵעָלַי לְגַמְרֵי מֵעַתָּה וְעַד עוֹלָם, כִּי כְּבָר כָּלוּ בְיָגוֹן חַיָּי, וּשְׁנוֹתַי בָּאֲנָחָה, כָּשַׁל בַּעֲוֹנִי כֹחִי, וַעֲצָמַי עָשֵׁשׁוּ, עַד אֲשֶׁר כָּשַׁל כֹּחַ הַסַּבָּל:<\/p><p><b>רַחֵם<\/b> עָלַי אָבִי אָב הָרַחֲמָן; רַחֵם עָלַי שׁוֹמֵעַ תְּפִלָּה; חוּס וַחֲמֹל עָלַי, שׁוֹמֵעַ צְעָקָה, שׁוֹמֵעַ אֲנָחָה, שׁוֹמֵעַ אֲנָקָה, רַחֵם רַחֵם, הַצֵּל הַצֵּל, הוֹשִׁיעָה הוֹשִׁיעָה! אַל יִפֹּל דָּמִי אַרְצָה לְפָנֶיךָ, אַל תִּתֵּן לְשַׁחַת נַפְשִׁי, הַצִּילֵנִי מִדָּמִים, אֱלֹהִים, אֱלֹהֵי תְשׁוּעָתִי. תְּרַנֵּן לְשׁוֹנִי צִדְקָתֶךָ. חוּסָה עָלַי, כְּרֹב רַחֲמֶיךָ, כְּרֹב חֲסָדֶיךָ, יֶהֱמוּ נָא מֵעֶיךָ וַחֲנִינוֹתֶיךָ עַל עֲלוּב נֶפֶשׁ כָּמוֹנִי, עַל נִרְדָּף כָּמוֹנִי, עַל מְלֻכְלָךְ בַּחֲטָאִים כָּמוֹנִי, עַל חֲסַר דֵּעָה, חֲסַר עֵצָה כָּמוֹנִי, כִּי לְךָ לְבַד עֵינֵינוּ תְלוּיוֹת, לְךָ לְבַד רַעְיוֹנַי צוֹפִיּוֹת, דַּלּוּ עֵינַי לַמָּרוֹם, עֲזֹר נָא, הוֹשִׁיעָה נָּא, חוּס וַחֲמֹל נָא עָלַי וְהוֹשִׁיעֵנִי לָשׁוּב אֵלֶיךָ בִּתְשׁוּבָה שְׁלֵמָה, בֶּאֱמֶת וּבְלֵב שָׁלֵם, וְאֶזְכֶּה לִהְיוֹת תָּמִיד כִּרְצוֹנְךָ הַטּוֹב מֵעַתָּה וְעַד עוֹלָם. כְּחַסְדְּךָ חַיֵּינִי, וְאֶשְׁמְרָה עֵדוּת פִּיךָ. לֵב טָהוֹר בְּרָא לִי אֱלֹהִים, וְרוּחַ נָכוֹן חַדֵּשׁ בְּקִרְבִּי:<\/p><p><b>וּבְכֵן<\/b>, יְהִי רָצוֹן מִלְּפָנֶיךָ, יְהֹוָה אֱלֹהֵינוּ וֵאלֹהֵי אֲבוֹתֵינוּ, אֲדוֹן הַשִּׂמְחָה וְהַחֶדְוָה, אֲשֶׁר לְפָנֶיךָ אֵין שׁוּם עַצְבוּת כְּלָל לְעוֹלָם, כְּמוֹ שֶׁכָּתוּב: הוֹד וְהָדָר לְפָנָיו, עֹז וְחֶדְוָה בִּמְקוֹמוֹ. שֶׁתַּעַזְרֵנִי בְּרַחֲמֶיךָ הָעֲצוּמִים וּתְזַכֵּנִי לִהְיוֹת בְּשִׂמְחָה תָּמִיד. מְשַׂמֵּחַ נַפְשׁוֹת עֲגוּמִים, שַׂמַּח נַפְשִׁי הָאֻמְלָלָה מְאֹד, הָעֲלוּבָה מְאֹד, הָעֲיֵפָה וְהַצְּמֵאָה וְהָרְעֵבָה אֵלֶיךָ מְאֹד, הָסֵר מִמֶּנִּי יָגוֹן וַאֲנָחָה, שַׂמֵּחַ נֶפֶשׁ עַבְדֶּךָ, כִּי אֵלֶיךָ יְהֹוָה נַפְשִׁי אֶשָּׂא.<\/p><p><b>תּוֹדִיעֵנִי<\/b> אֹרַח חַיִּים. שֹׂבַע שְׂמָחוֹת אֶת פָּנֶיךָ, נְעִימוֹת בִּימִינְךָ נֶצַח. הָשִׁיבָה לִי שְׂשׂוֹן יִשְׁעֶךָ, וְרוּחַ נְדִיבָה תִסְמְכֵנִי. שַׂבְּעֵנִי מִטּוּבֶךָ, וְשַׂמַּח נַפְשִׁי בִּישׁוּעָתֶךָ, וְטַהֵר לִבִּי לְעָבְדְּךָ בֶּאֱמֶת. עוּרָה כְבוֹדִי, עוּרָה הַנֵּבֶל וְכִנּוֹר, אָעִירָה שָׁחַר. זַכֵּנִי לְכָל הָעֲשָׂרָה מִינֵי נְגִינָה דִּקְדֻשָּׁה, שֶׁהֵם מַכְנִיעִים וּמְתַקְּנִים פְּגַם הַבְּרִית, כָּאָמוּר: אֲבָרֵךְ אֶת יְהֹוָה אֲשֶׁר יְעָצָנִי, אַף לֵילוֹת יִסְּרוּנִי כִלְיוֹתָי. לְדָוִד מַשְׂכִּיל, אַשְׁרֵי נְשׂוּי פֶּשַׁע כְּסוּי חַטָּאָה. בַּיִת וָהוֹן נַחֲלַת אָבוֹת, וּמֵיְהֹוָה אִשָּׁה מַשְׂכָּלֶת. יוֹמָם יְצַוֶּה יְהֹוָה חַסְדּוֹ, וּבַלַּיְלָה שִׁירֹה עִמִּי, תְּפִלָּה לְאֵל חַיָּי. לַמְנַצֵּחַ אַל תַּשְׁחֵת לְדָוִד מִכְתָּם בִּשְׁלֹחַ שָׁאוּל וַיִּשְׁמְרוּ אֶת הַבַּיִת לַהֲמִיתוֹ. אֶזְכְּרָה נְגִינָתִי בַּלָּיְלָה, עִם לְבָבִי אָשִׂיחָה וַיְחַפֵּשׂ רוּחִי. הֲיֵאָכֵל תָּפֵל מִבְּלִי מֶלַח, אִם יֵשׁ טַעַם בְּרִיר חֲלָמוּת. פֶּן תִּתֵּן לַאֲחֵרִים הוֹדֶךָ וּשְׁנוֹתֶיךָ לְאַכְזָרִי. וְלֹא אָמַר, אַיֵּה אֱלוֹהַּ עֹשָׂי נּוֹתֵן זְמִירוֹת בַּלָּיְלָה. שֶׁקֶר הַחֵן וְהֶבֶל הַיֹּפִי, אִשָּׁה יִרְאַת יְהֹוָה הִיא תִתְהַלָּל. וְנֶאֱמַר: הַלְלוּיָהּ, הַלְלוּ אֵל בְּקָדְשׁוֹ, הַלְלוּהוּ בִּרְקִיעַ עֻזּוֹ. הַלְלוּהוּ בִגְבוּרוֹתָיו, הַלְלוּהוּ כְּרֹב גֻּדְלוֹ, הַלְלוּהוּ בְּתֵקַע שׁוֹפָר, הַלְלוּהוּ בְּנֵבֶל וְכִנּוֹר: הַלְלוּהוּ בְּתֹף וּמָחוֹל הַלְלוּהוּ בְּמִנִּים וְעֻגָּב: הַלְלוּהוּ בְצִלְצְלֵי שָׁמַע, הַלְלוּהוּ בְּצִלְצְלֵי תְרוּעָה. כֹּל הַנְּשָׁמָה תְּהַלֵּל יָהּ הַלְלוּיָהּ:<\/p><p><b>רִבּוֹנוֹ<\/b> שֶׁל עוֹלָם! תְּקַע בְּשׁוֹפָר גָּדוֹל לְחֵרוּתֵנוּ, וְשָׂא נֵס לְקַבֵּץ גָּלֻיּוֹתֵינוּ, וְקָרֵב פְּזוּרֵנוּ מִבֵּין הַגּוֹיִם, וּנְפוּצוֹתֵינוּ כַּנֵּס מִיַּרְכְּתֵי אָרֶץ. וְקַבֵּץ נִדָּחֵנוּ יַחַד מֵאַרְבַּע כַּנְפוֹת הָאָרֶץ לְאַרְצֵנוּ: וְקַיֵּם בָּנוּ מִקְרָא שֶׁכָּתוּב: וְשָׁב יְהֹוָה אֱלֹהֶיךָ אֶת שְׁבוּתְךָ וְרִחֲמֶךָ, וְשָׁב וְקִבֶּצְךָ מִכָּל הָעַמִּים, אֲשֶׁר הֱפִיצְךָ יְהֹוָה אֱלֹהֶיךָ שָׁמָּה. אִם יִהְיֶה נִדָּחֲךָ בִּקְצֵה הַשָּׁמָיִם, מִשָּׁם יְקַבֶּצְךָ יְהֹוָה אֱלֹהֶיךָ וּמִשָּׁם יִקָּחֶךָ. וֶהֱבִיאֲךָ יְהֹוָה אֱלֹהֶיךָ אֶל הָאָרֶץ, אֲשֶׁר יָרְשׁוּ אֲבוֹתֶיךָ, וִירִשְׁתָּהּ וְהֵיטִיבְךָ, וְהִרְבְּךָ מֵאֲבוֹתֶיךָ. וְנֶאֱמַר: נְאֻם יְהֹוָה אֱלֹהִים, מְקַבֵּץ נִדְחֵי יִשְׂרָאֵל, עוֹד אֲקַבֵּץ עָלָיו לְנִקְבָּצָיו. וְנֶאֱמַר: בּוֹנֵה יְרוּשָׁלַיִם יְהֹוָה, נִדְחֵי יִשְׂרָאֵל יְכַנֵּס. וּתְמַהֵר וְתָחִישׁ לְגָאֳלֵנוּ, וְתָבִיא לָנוּ אֶת מְשִׁיחַ צִדְקֵנוּ, וְתִבְנֶה אֶת בֵּית קָדְשֵׁנוּ וְתִפְאַרְתֵּנוּ, וַהֲבִיאֵנוּ לְצִיּוֹן עִירְךָ בְּרִנָּה, וְלִירוּשָׁלַיִם בֵּית מִקְדָשְׁךָ בְּשִׂמְחַת עוֹלָם. כְּמוֹ שֶׁכָּתוּב: וּפְדוּיֵי יְהֹוָה יְשׁוּבוּן, וּבָאוּ צִיּוֹן בְּרִנָּה, וְשִׂמְחַת עוֹלָם עַל רֹאשָׁם, שָׂשׂוֹן וְשִׂמְחָה יַשִּׂיגוּ, וְנָסוּ יָגוֹן וַאֲנָחָה. וְנֶאֱמַר: כִּי בְּשִׂמְחָה תֵצֵאוּ, וּבְשָׁלוֹם תּוּבָלוּן, הֶהָרִים וְהַגְּבָעוֹת יִפְצְחוּ לִפְנֵיכֶם רִנָּה, וְכָל עֲצֵי הַשָּׂדֶה יִמְחֲאוּ כָף. וְנֶאֱמַר: כִּי נִחַם יְהֹוָה צִיּוֹן, נִחַם כָּל חָרְבוֹתֶיהָ, וַיָּשֶׂם מִדְבָּרָהּ כְּעֵדֶן וְעַרְבָתָהּ כְּגַן יְהֹוָה, שָׂשׂוֹן וְשִׂמְחָה יִמָּצֵא בָהּ, תּוֹדָה וְקוֹל זִמְרָה. שִׂמְחוּ בַיהֹוָה וְגִילוּ צַדִּיקִים, וְהַרְנִינוּ כָּל יִשְׁרֵי לֵב. אוֹר זָרוּעַ לַצַּדִּיק, וּלְיִשְׁרֵי לֵב שִׂמְחָה. שִׂמְחוּ צַדִּיקִים בַּיהֹוָה, וְהוֹדוּ לְזֵכֶר קָדְשׁוֹ. אָמֵן נֶצַח סֶלָה וָעֶד:<\/p><div class=\"fold-sub\">תְּפִלַּת ״עִלַּת הָעִלּוֹת״<\/div><p class=\"ins\">זֹאת הַתְּפִלָּה מָצָאנוּ בְּאַמְתַּחַת הַכְּתָבִים, וְהִיא מְעָט הַכַּמּוּת וְרַב הָאֵיכוּת<\/p><p><b>רִבּוֹנוֹ<\/b> שֶׁל עוֹלָם, עִלַּת הָעִלּוֹת וְסִבַּת כָּל const _hc={};
function hebParts(date){const k=date.toDateString();if(_hc[k])return _hc[k];const p=new Intl.DateTimeFormat('en-u-ca-hebrew',{day:'numeric',month:'long',year:'numeric'}).formatToParts(date);const g=t=>p.find(x=>x.type===t)?.value;return _hc[k]={d:+g('day'),m:g('month'),y:+(g('year')||g('relatedYear'))}}
function hebLetters(n){const o=['','א','ב','ג','ד','ה','ו','ז','ח','ט'],t=['','י','כ','ל','מ','נ','ס','ע','פ','צ'],h=['','ק','ר','ש','ת'];let s='';n%=1000;while(n>=400){s+='ת';n-=400}if(n>=100){s+=h[Math.floor(n/100)];n%=100}if(n===15)return s+'טו';if(n===16)return s+'טז';return s+t[Math.floor(n/10)]+o[n%10]}
function geresh(s){return s.length===1?s+'׳':s.slice(0,-1)+'״'+s.slice(-1)}
const heDay=n=>geresh(hebLetters(n));
const heYear=y=>geresh(hebLetters(y));
function hebDate(date,noYear){const p=hebParts(date);return heDay(p.d)+' '+HM[p.m]+(noYear?'':' '+heYear(p.y))}
const iso=dt=>dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
const fromIso=s=>{const[a,b,c]=s.split('-');return new Date(+a,+b-1,+c,12)};
const addDays=(dt,n)=>{const x=new Date(dt);x.setDate(x.getDate()+n);return x};
const gStr=dt=>dt.getDate()+'.'+(dt.getMonth()+1)+'.'+dt.getFullYear();
const mMatch=(hm,cur)=>hm===cur||(hm==='Adar'&&cur==='Adar II');
function hillulotOn(date){const p=hebParts(date);return S.hillulot.filter(h=>h.d===p.d&&mMatch(h.m,p.m))}
/* חגים ומועדים (ירושלים) */
function holidaysOn(dt){
  const {d,m,y}=hebParts(dt),w=dt.getDay(),o=[];const leap=((7*y+1)%19)<7;const AM=leap?'Adar II':'Adar';
  if((d===1&&m!=='Tishri')||d===30)o.push('ראש חודש');
  if(m==='Tishri'){if(d<=2)o.push('ראש השנה');if((d===3&&w!==6)||(d===4&&w===0))o.push('צום גדליה');if(d===9)o.push('ערב יום כיפור');if(d===10)o.push('יום הכיפורים');if(d===14)o.push('ערב סוכות');if(d===15)o.push('סוכות');if(d>=16&&d<=20)o.push('חול המועד סוכות');if(d===21)o.push('הושענא רבה');if(d===22)o.push('שמיני עצרת ושמחת תורה')}
  for(let k=0;k<8;k++){const p=hebParts(addDays(dt,-k));if(p.m==='Kislev'&&p.d===25){o.push('חנוכה – נר '+heDay(k+1));break}}
  if(m==='Tevet'&&d===10)o.push('עשרה בטבת');
  if(m==='Shevat'&&d===15)o.push('ט״ו בשבט');
  if(m===AM){if((d===13&&w!==6)||(d===11&&w===4))o.push('תענית אסתר');if(d===14)o.push('פורים');if(d===15)o.push('שושן פורים (ירושלים)')}
  if(leap&&m==='Adar I'&&d===14)o.push('פורים קטן');
  if(m==='Nisan'){if(d===14)o.push('ערב פסח');if(d===15)o.push('פסח');if(d>=16&&d<=20)o.push('חול המועד פסח');if(d===21)o.push('שביעי של פסח')}
  if(m==='Iyar'&&d===18)o.push('ל״ג בעומר');
  if(m==='Sivan'){if(d===5)o.push('ערב שבועות');if(d===6)o.push('שבועות')}
  if(m==='Tamuz'&&((d===17&&w!==6)||(d===18&&w===0)))o.push('צום י״ז בתמוז');
  if(m==='Av'){if((d===9&&w!==6)||(d===10&&w===0))o.push('תשעה באב');if(d===15)o.push('ט״ו באב')}
  if(m==='Elul'&&d===29)o.push('ערב ראש השנה');
  return o;
}
/* כל מה שקורה בתאריך מסוים */
function adsOn(dt){const s=iso(dt);return S.ads.filter(a=>a.st==='ok'&&(!a.until||a.until>=s)&&((a.date&&a.date===s)||(a.d&&DAYSETS[a.d]?.d.includes(dt.getDay()))))}
const pinsOn=dt=>(S.pins||[]).filter(p=>p.date===iso(dt)).sort((a,b)=>toMin(a.tm)-toMin(b.tm));
const notesOn=dt=>(U.notes||[]).filter(n=>n.date===iso(dt)).sort((a,b)=>toMin(a.tm)-toMin(b.tm));
function diffTxt(m){if(m<1)return'עכשיו';if(m<60)return`בעוד ${m} דק׳`;const h=Math.floor(m/60),r=m%60;return`בעוד ${h}:${String(r).padStart(2,'0')} ש׳`}
function greet(){const h=new Date().getHours();return h<5?'לילה טוב':h<12?'בוקר טוב':h<17?'צהריים טובים':h<21?'ערב טוב':'לילה טוב'}

/* אוסף את כל המניינים/הפעילויות ליום מסוים */
/* ===== זמנים יחסיים: "@set-20" = 20 דק׳ לפני השקיעה ===== */
const RELB={set:'השקיעה',tzeit:'צאת הכוכבים',rt:'צאת ר״ת',rise:'הנץ',plag:'פלג המנחה',candle:'הדלקת נרות'};
const isRel=t=>typeof t==='string'&&t[0]==='@';
function parseRel(t){const m=/^@(\w+)([+-])(\d+)$/.exec(t||'');return m?{b:m[1],s:m[2],n:+m[3]}:null}
function minTxt(n){return n===60?'שעה':n===75?'שעה ורבע':n===90?'שעה וחצי':n===120?'שעתיים':n+' דק׳'}
function relLabel(t){const r=parseRel(t);if(!r)return'';const B=RELB[r.b]||r.b;if(!r.n)return r.b==='set'?'בשקיעה':B;return minTxt(r.n)+(r.s==='-'?' לפני ':' אחרי ')+B}
const _zc={};
function zAt(dt){const k=iso(dt);return _zc[k]||(_zc[k]=zmanim(dt,DEF_LOC))}
function resolveTm(t,dt){
  if(!isRel(t))return t||'';const r=parseRel(t);if(!r)return'';
  const z=zAt(dt||new Date());const base=z[r.b];if(!base)return'';
  const d=addM(base,(r.s==='-'?-1:1)*r.n);const ms=d.getTime();
  const up=['tzeit','rt'].includes(r.b);const q=up?new Date(Math.ceil(ms/6e4)*6e4):new Date(Math.floor(ms/6e4)*6e4);return hm(q);
}
function dateForDay(day,from){const b=from?new Date(from):new Date();b.setHours(12,0,0,0);return addDays(b,(day-b.getDay()+7)%7)}
function nextDateIn(dk){const ds=DAYSETS[dk]?.d||[0,1,2,3,4,5,6];const t=new Date();t.setHours(12,0,0,0);for(let i=0;i<7;i++){const x=addDays(t,i);if(ds.includes(x.getDay()))return x}return t}
const dispTm=p=>resolveTm(p.tm,nextDateIn(p.d));
function collect(kind,day,filter,dt){
  const out=[];const date=dt||dateForDay(day);
  S.shuls.filter(inNh).forEach(s=>(s[kind]||[]).forEach(x=>{
    const ds=DAYSETS[x.d];if(!ds||!ds.d.includes(day))return;
    if(filter&&!filter(x))return;
    out.push({...x,rel:isRel(x.tm)?x.tm:'',tm:resolveTm(x.tm,date),s});
  }));
  const k=x=>x.tm?toMin(x.tm):9999;return out.sort((a,b)=>k(a)-k(b));
}

function gabbaimOf(s){if(s.gabbaim&&s.gabbaim.length)return s.gabbaim;return(s.gabbai||s.phone)?[{name:s.gabbai||'',phone:s.phone||'',pub:true}]:[]}
const telOk=p=>(p||'').replace(/\D/g,'').length>=9;
const waNum=p=>{let d=(p||'').replace(/\D/g,'');if(d[0]==='0')d='972'+d.slice(1);return d};
function missingOf(s){const m=[];if(!gabbaimOf(s).some(g=>telOk(g.phone)))m.push('טלפון של גבאי');if(!(s.address||'').trim())m.push('כתובת');if(!(s.prayers||[]).length)m.push('זמני תפילות');return m}

/* המניין הקרוב ביותר – מכל בתי הכנסת */
function nearest(){
  const now=new Date(),nm=nowMin();let day=now.getDay(),lbl='';
  let l=collect('prayers',day,p=>p.t!=='זמן'&&p.tm).filter(p=>toMin(p.tm)>=nm);
  if(!l.length){day=(day+1)%7;lbl='מחר';l=collect('prayers',day,p=>p.t!=='זמן'&&p.tm)}
  if(!l.length)return'';
  const first=l.filter(p=>p.tm===l[0].tm);
  const df=lbl?null:toMin(first[0].tm)-nm;
  return `<section class="near" aria-live="polite" aria-label="המניין הקרוב">
    <div class="near-h"><span style="display:flex;align-items:center;gap:6px">${ic('clock','sm')} המניין הקרוב</span>${df!==null?`<span class="near-in">${diffTxt(df)}</span>`:`<span class="near-in">${lbl}</span>`}</div>
    ${first.map(p=>{const q=encodeURIComponent(p.s.address+' '+(p.s.nh||''));return `<div class="near-r">
      <button class="near-main" onclick="go('shul',{id:'${p.s.id}'})" aria-label="פרטי ${esc(p.s.name)}">
        <span class="near-t">${esc(p.tm)}</span>
        <span class="near-x"><b>${esc(p.t)}</b><span>${esc(p.s.name)}</span>${p.n?`<small>${esc(p.n)}</small>`:''}</span>
      </button>
      <a class="near-go" href="https://waze.com/ul?q=${q}&navigate=yes" target="_blank" rel="noopener" aria-label="ניווט ל${esc(p.s.name)}">🚗<span>נווט</span></a>
    </div>`}).join('')}
  </section>`;
}
function prayerRow(p,day){
  const today=day===new Date().getDay();const df=toMin(p.tm)-nowMin();

  return `<div class="row ${past?'past':''}" onclick="go('shul',{id:'${p.s.id}'})" style="cursor:pointer">
    <div class="time">${esc(p.tm)||'<small style="font-size:.7rem">'+esc(p.n||'')+'</small>'}</div>
    <div class="main"><b>${esc(p.t||p.title)} · ${esc(p.s.name)}</b>${p.end?`<span class="muted">עד ${esc(p.end)} · </span>`:''}<span class="muted">${p.rel?'⏱ '+relLabel(p.rel)+' · ':''}${esc(p.s.nh)}${p.n?' · '+esc(p.n):''}${p.who?' · '+esc(p.who):''}</span></div>

  const s=shul(sid),x=s[kind].find(q=>q.id===id);const title=(x.t||x.title)+' · '+s.name;
  window._r={title,tm:x.tm,d:x.d};const shown=dispTm(x)+(isRel(x.tm)?' ('+relLabel(x.tm)+')':'');
  modal(`<b>${esc(title)}</b><div class="muted">${DAYSETS[x.d]?.l} · ${shown}</div>
  <label class="f">כמה זמן לפני להזכיר?</label><select class="inp" id="rb"><option value="5">5 דקות</option><option value="10" selected>10 דקות</option><option value="15">15 דקות</option><option value="30">חצי שעה</option></select>
  <button class="btn" style="width:100%;margin-top:14px" onclick="addRem()">הפעלת תזכורת 🔔</button>`,'תזכורת');
}
function askNotif(){if('Notification'in window&&Notification.permission==='default')Notification.requestPermission()}
function addRem(){U.rem.push({id:uid(),...window._r,before:+$('#rb').value});saveU();closeModal();toast('התזכורת נשמרה 🔔');askNotif()}
function notify(msg){if('Notification'in window&&Notification.permission==='granted')new Notification('תזכורת 🔔',{body:msg});toast('🔔 '+msg)}
function checkRem(){
  const d=new Date(),day=d.getDay(),nm=nowMin(),key=d.toDateString();
  U.rem.forEach(r=>{if(!DAYSETS[r.d]?.d.includes(day))return;const tm=resolveTm(r.tm,d);if(!tm)return;const at=toMin(tm)-r.before;const k=r.id+key;
    if(nm>=at&&nm<=toMin(tm)&&!U.fired[k]){U.fired[k]=1;saveU();notify(`${r.title} בשעה ${tm}`)}});
  notesOn(d).forEach(n=>{if(!n.tm)return;const k='n'+n.id;if(nm>=toMin(n.tm)-(n.before||0)&&nm<=toMin(n.tm)+5&&!U.fired[k]){U.fired[k]=1;saveU();notify(n.text+' · '+n.tm)}});
}

function monthStart(dt){return addDays(dt,-(hebParts(dt).d-1))}

  const ms=ST.ms?fromIso(ST.ms):monthStart(today);
  const hp=hebParts(ms);
  const days=[];for(let i=0;i<31;i++){const x=addDays(ms,i);if(i>0&&hebParts(x).d===1)break;days.push(x)}

  const GM=['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
  const gTitle=ms.getMonth()===last.getMonth()?GM[ms.getMonth()]+' '+ms.getFullYear():GM[ms.getMonth()]+(ms.getFullYear()!==last.getFullYear()?' '+ms.getFullYear():'')+' – '+GM[last.getMonth()]+' '+last.getFullYear();
  const prev=iso(monthStart(addDays(ms,-1))),next=iso(addDays(last,1));
  let cells='';for(let i=0;i<ms.getDay();i++)cells+='<div></div>';
  const list=[];

    const p=hebParts(x),hol=holidaysOn(x),hil=hillulotOn(x),pins=pinsOn(x),ads=adsOn(x).filter(a=>a.date),nts=notesOn(x);
    const isT=iso(x)===iso(today),sh=x.getDay()===6;
    const big=hol.find(h=>h!=='ראש חודש');
    cells+=`<button class="cd ${isT?'today':''} ${sh?'sh':''} ${big?'hol':''}" onclick="openDay('${iso(x)}')" aria-label="${hebDate(x)} ${gStr(x)}${hol.length?' · '+hol.join(', '):''}">
      <span class="hd">${heDay(p.d)}</span><span class="gd">${x.getDate()}</span>
      ${big?`<span class="hn">${esc(big.split(' –')[0])}</span>`:hol.length?`<span class="hn">ר״ח</span>`:''}
      <span class="dots">${hil.length?'<i class="dg"></i>':''}${pins.length||ads.length?'<i class="db"></i>':''}${nts.length?'<i class="dn"></i>':''}</span></button>`;
    hol.forEach(h=>list.push({x,em:'✡️',t:h}));moladEvents(x).forEach(m=>list.push({x,em:m.em,t:m.t}));hil.forEach(h=>list.push({x,em:'🕯️',t:'הילולת '+h.name}));
    pins.forEach(q=>list.push({x,em:'📌',t:q.title+(q.sid&&shul(q.sid)?' · '+shul(q.sid).name:'')}));ads.forEach(a=>list.push({x,em:'📢',t:a.title}));
    nts.forEach(n=>list.push({x,em:'📝',t:n.text}));

  return `<div class="calhead">
    <button class="iconbtn cb" aria-label="חודש קודם" onclick="ST.ms='${prev}';render()">›</button>
    <div style="text-align:center;flex:1"><h2 style="margin:0">${HM[hp.m]} ${heYear(hp.y)}</h2><div class="muted">(${gTitle})</div></div>
    <button class="iconbtn cb" aria-label="חודש הבא" onclick="ST.ms='${next}';render()">‹</button></div>
  ${ST.ms&&ST.ms!==iso(monthStart(today))?`<div style="text-align:center;margin-bottom:8px"><button class="btn ghost sm" onclick="ST.ms='';render()">חזרה להיום</button></div>`:''}
  <div class="card" style="padding:10px">
    <div class="cgrid wd">${['א׳','ב׳','ג׳','ד׳','ה׳','ו׳','ש׳'].map(x=>`<div>${x}</div>`).join('')}</div>
    <div class="cgrid">${cells}</div>
    <div class="legend"><span><i class="dg"></i>הילולא</span><span><i class="db"></i>אירוע / מודעה</span><span><i class="dn"></i>אישי שלי</span></div>
  </div>
  <div class="card"><h3>📋 החודש בלוח</h3>${list.length?list.map(o=>`<div class="row" style="cursor:pointer" onclick="openDay('${iso(o.x)}')"><span style="font-size:1.2rem">${o.em}</span><div class="main"><b>${esc(o.t)}</b><span class="muted">יום ${DAYNAMES[o.x.getDay()]}, ${hebDate(o.x,1)} (${gStr(o.x)})</span></div></div>`).join(''):'<div class="empty-msg">אין אירועים מיוחדים החודש</div>'}</div>`;

/* ===== זמני היום (חישוב אסטרונומי) ===== */
function sunT(dt,lat,lng,zen,rise){
  const r=Math.PI/180,y=dt.getFullYear();
  const N=Math.round((new Date(y,dt.getMonth(),dt.getDate(),12)-new Date(y,0,0,12))/864e5);
  const lh=lng/15,t=N+((rise?6:18)-lh)/24,M=0.9856*t-3.289;
  let L=(M+1.916*Math.sin(M*r)+0.020*Math.sin(2*M*r)+282.634+360)%360;
  let RA=(Math.atan(0.91764*Math.tan(L*r))/r+360)%360;RA=(RA+Math.floor(L/90)*90-Math.floor(RA/90)*90)/15;
  const sd=0.39782*Math.sin(L*r),cd=Math.cos(Math.asin(sd));
  const ch=(Math.cos(zen*r)-sd*Math.sin(lat*r))/(cd*Math.cos(lat*r));if(ch>1||ch<-1)return null;
  const H=(rise?360-Math.acos(ch)/r:Math.acos(ch)/r)/15;
  const UT=((H+RA-0.06571*t-6.622-lh)%24+24)%24;
  return new Date(Date.UTC(y,dt.getMonth(),dt.getDate())+UT*36e5);
}
const hm=d=>d?String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'):'—';
const addM=(d,m)=>d?new Date(d.getTime()+m*6e4):null;
function zmanim(dt,loc){
  const{lat,lng}=loc||LOC();const z={};
  z.rise=sunT(dt,lat,lng,90.833,1);z.set=sunT(dt,lat,lng,90.833,0);
  z.alot=sunT(dt,lat,lng,106.1,1);z.tzMga=sunT(dt,lat,lng,106.1,0);
  z.tal=sunT(dt,lat,lng,101.5,1);z.tzeit=sunT(dt,lat,lng,98.5,0);
  if(!z.rise||!z.set)return z;
  const g=(z.set-z.rise)/12/6e4,m=(z.tzMga-z.alot)/12/6e4;
  Object.assign(z,{shmaM:addM(z.alot,3*m),shmaG:addM(z.rise,3*g),tfM:addM(z.alot,4*m),tfG:addM(z.rise,4*g),chatzot:addM(z.rise,6*g),
    mg:addM(z.rise,6.5*g),mk:addM(z.rise,9.5*g),plag:addM(z.rise,10.75*g),rt:addM(z.set,72),candle:addM(z.set,-40),shaa:g});
  return z;
}

/* ----- מולד, ראש חודש, שבת מברכים וברכת הלבנה (נתונים: אתר ישיבה) ----- */
let _ml=null;const MOLAD=()=>_ml||(_ml=JSON.parse($('#moladdata').textContent));
const molFix=s=>String(s).replace(/ ו (\d)/g,' ו־$1').replace(/\s+/g,' ');
function mevOf(e){if(e.m==='תשרי')return null;let d=addDays(fromIso(e.rc[0]),-1);while(d.getDay()!==6)d=addDays(d,-1);return d}
const levStart=e=>addDays(fromIso(e.mg),3);
function nextMolad(dt){const s=iso(dt||new Date());return MOLAD().find(e=>e.rc[e.rc.length-1]>=s||e.kg>=s&&e.mg<=s)||null}
function curMolad(dt){const s=iso(dt||new Date());return MOLAD().find(e=>e.rc[e.rc.length-1]>=s)||null}
function moladEvents(dt){const s=iso(dt),o=[];MOLAD().forEach(e=>{
  if(e.mg===s)o.push({em:'🌑',t:'המולד – חודש '+e.m,s:'בשעון ישראל '+e.t});
  const mv=mevOf(e);if(mv&&iso(mv)===s)o.push({em:'✨',t:'שבת מברכים חודש '+e.m,s:'פרשת '+e.par+' · ראש חודש: '+e.rcd});

function initYtDrag(){
  const f=$('#ytFab');if(!f)return;const W=54;
  const place=()=>{if(U.ytPos){const x=U.ytPos.edge==='l'?-W/2:U.ytPos.edge==='r'?innerWidth-W/2:Math.min(innerWidth-W,Math.max(0,U.ytPos.x));f.style.left=x+'px';f.style.top=Math.min(innerHeight-150,Math.max(70,U.ytPos.y))+'px';f.style.bottom='auto';f.classList.toggle('edge',!!U.ytPos.edge)}};
  place();addEventListener('resize',place);
  let tmr;const wake=()=>{f.classList.remove('dim');clearTimeout(tmr);tmr=setTimeout(()=>f.classList.add('dim'),3500)};wake();
  addEventListener('scroll',()=>{if(!f.classList.contains('dim'))return},{passive:true});
  let sx,sy,ox,oy,moved=false,down=false;
  f.addEventListener('pointerdown',e=>{down=true;moved=false;sx=e.clientX;sy=e.clientY;const r=f.getBoundingClientRect();ox=r.left;oy=r.top;wake()});
  addEventListener('pointermove',e=>{if(!down)return;const dx=e.clientX-sx,dy=e.clientY-sy;if(!moved&&Math.hypot(dx,dy)<8)return;moved=true;f.classList.add('drag');f.classList.remove('edge');
    f.style.left=Math.min(innerWidth-W/2,Math.max(-W/2,ox+dx))+'px';f.style.top=Math.min(innerHeight-150,Math.max(70,oy+dy))+'px';f.style.bottom='auto'});
  addEventListener('pointerup',()=>{if(!down)return;down=false;f.classList.remove('drag');
    if(moved){const x=parseFloat(f.style.left),y=parseFloat(f.style.top);let edge='';if(x<12)edge='l';else if(x>innerWidth-W-12)edge='r';
      U.ytPos={x,y,edge};saveU();place();if(edge)toast('הכפתור הוסתר בצד – אפשר למשוך אותו בחזרה')}
    wake()});
  f.addEventListener('click',e=>{if(moved){e.preventDefault();moved=false;return}
    if(U.ytPos&&U.ytPos.edge&&!f.dataset.peek){e.preventDefault();f.dataset.peek=1;f.style.left=(U.ytPos.edge==='l'?6:innerWidth-W-6)+'px';f.classList.remove('edge');wake();setTimeout(()=>{delete f.dataset.peek;place()},4000)}});
}

async function cloudInit(){
  try{
    const base='https://www.gstatic.com/firebasejs/'+FBV+'/';
    const [app,A,F]=await Promise.all([import(base+'firebase-app.js'),import(base+'firebase-auth.js'),import(base+'firebase-firestore.js')]);
    C.A=A;C.F=F;C.appMod=app;
    const fa=app.initializeApp(FB_CFG);
    let fs;try{fs=F.initializeFirestore(fa,{localCache:F.persistentLocalCache({tabManager:F.persistentMultipleTabManager()})})}catch(e){fs=F.getFirestore(fa)}
    C.fs=fs;C.auth=A.getAuth(fa);C.ok=true;
    listenPublic();
    A.onAuthStateChanged(C.auth,async u=>{
      if(!u){try{await A.signInAnonymously(C.auth)}catch(e){console.warn(e)}return}
      let role=null;
      if(!u.isAnonymous){
        if(u.email===ADMIN_EMAIL)role={type:'admin'};
        else{try{const r=await F.getDoc(F.doc(fs,'roles',u.uid));if(r.exists())role={type:'gabbai',sid:r.data().sid}}catch(e){}}
      }
      ROLE=role;
      if(role&&role.type==='admin'){listenAdmin();loadSecrets();loadStats()}else stopAdmin();
      if(role&&role.type==='gabbai'){const s=shul(role.sid);if(s&&missingOf(s).length)setTimeout(()=>toast('⚠️ חסרים פרטים בבית הכנסת שלך: '+missingOf(s).join(', ')),1200)}
      countVisit();softRender();
    });
  }catch(e){console.warn('cloud off',e)}
}
const col=n=>C.F.collection(C.fs,n), dref=(n,id)=>C.F.doc(C.fs,n,id);
function listenPublic(){
  const F=C.F;
  C.unsub.cfg=F.onSnapshot(dref('config','main'),d=>{if(!d.exists())return;const v=d.data();if(v.settings)S.settings=Object.assign({},S.settings,v.settings);if(v.neighborhoods)S.neighborhoods=v.neighborhoods;if(v.hillulot)S.hillulot=v.hillulot;S.cloud=1;save();softRender()});
  C.unsub.shuls=F.onSnapshot(col('shuls'),q=>{if(q.empty&&!S.cloud)return;const old={};S.shuls.forEach(s=>old[s.id]=s);
    S.shuls=q.docs.map(d=>{const v=d.data();v.id=d.id;v.photos=(old[d.id]&&old[d.id].photos)||[];v.photoIds=(old[d.id]&&old[d.id].photoIds)||[];return v});S.cloud=1;save();softRender()});
  C.unsub.tick=F.onSnapshot(F.query(col('ticker'),F.orderBy('dt','desc'),F.limit(30)),q=>{if(q.empty&&!S.cloud)return;S.ticker=q.docs.map(d=>({...d.data(),id:d.id}));save();softRender()});
  C.unsub.pins=F.onSnapshot(col('pins'),q=>{if(q.empty&&!S.cloud)return;S.pins=q.docs.map(d=>({...d.data(),id:d.id}));save();softRender()});
  C.unsub.ads=F.onSnapshot(F.query(col('ads'),F.where('st','==','ok')),q=>{if(q.empty&&!S.cloud)return;const pend=S.ads.filter(a=>a.st!=='ok'&&ROLE&&ROLE.type==='admin');S.ads=q.docs.map(d=>({...d.data(),id:d.id})).concat(pend);save();softRender()});
  C.unsub.th2=F.onSnapshot(col('th2'),q=>{if(q.empty&&!S.cloud)return;S.th2=S.th2||{books:[],total:0};S.th2.books=q.docs.map(d=>({...d.data(),id:d.id}));save();softRender()});
  C.unsub.th2t=F.onSnapshot(dref('pub','th2'),d=>{if(!d.exists())return;S.th2=S.th2||{books:[],total:0};S.th2.total=d.data().total||0;save();softRender()});
}
function listenAdmin(){if(C.unsub.adsAll)return;const F=C.F;C.unsub.adsAll=F.onSnapshot(F.query(col('ads'),F.where('st','==','pend')),q=>{S.ads=S.ads.filter(a=>a.st==='ok').concat(q.docs.map(d=>({...d.data(),id:d.id})));softRender()},e=>{})}
function stopAdmin(){if(C.unsub.adsAll){C.unsub.adsAll();delete C.unsub.adsAll}C.secrets={};S.ads=S.ads.filter(a=>a.st==='ok')}
async function loadSecrets(){try{const d=await C.F.getDoc(dref('secrets','gabbaim'));C.secrets=d.exists()?d.data():{};softRender()}catch(e){}}
async function loadStats(){try{const F=C.F;const[v,w]=await Promise.all([F.getDoc(dref('stats','visits')),F.getDoc(dref('stats','views'))]);const a=v.exists()?v.data():{};S.stats={visits:a.total||0,users:a.users||0,days:a.days||{},views:w.exists()?w.data():{}};softRender()}catch(e){}}
let _counted=false;
function countVisit(){
  if(_counted||!C.ok)return;_counted=true;
  if(sessionStorage.getItem('kv2')==='1')return;sessionStorage.setItem('kv2','1');
  const F=C.F,t=iso(new Date());const o={total:F.increment(1),days:{[t]:F.increment(1)}};
  if(!U.counted){o.users=F.increment(1);U.counted=1;saveU()}
  F.setDoc(dref('stats','visits'),o,{merge:true}).catch(()=>{});

function saveConfig(){if(!needCloud())return Promise.resolve();return C.F.setDoc(dref('config','main'),strip({settings:{appName:S.settings.appName,adminPhone:S.settings.adminPhone||'',tickerSpeed:S.settings.tickerSpeed||30},neighborhoods:S.neighborhoods,hillulot:S.hillulot}),{merge:true}).catch(cerr)}

async function login(){
  if(!needCloud())return;const sid=$('#lsid').value,p=$('#pw').value.trim();if(!sid||!p)return toast('נא לבחור ולהקליד קוד');
  const A=C.A;let email;
  if(sid==='__admin')email=ADMIN_EMAIL;else{const s=shul(sid);if(!s||!s.login)return toast('לבית הכנסת הזה עוד לא הוגדר קוד – פנו למנהל');email=s.login}
  try{await A.signInWithEmailAndPassword(C.auth,email,p);closeModal();toast('נכנסתם בהצלחה ✔️');setTimeout(()=>ROLE&&(ROLE.type==='admin'?go('admin'):go('shul',{id:ROLE.sid})),400)}
  catch(e){
    if(sid==='__admin'&&/invalid-credential|user-not-found/.test(e.code||'')){
      if(p.length<6)return toast('קוד שגוי');
      if(!confirm('אם זו הכניסה הראשונה של המנהל – ליצור עכשיו חשבון מנהל עם הסיסמה הזו?'))return;
      try{await A.createUserWithEmailAndPassword(C.auth,ADMIN_EMAIL,p);closeModal();toast('חשבון המנהל נוצר 🛡️');setTimeout(()=>go('admin'),500)}
      catch(e2){toast(e2.code==='auth/email-already-in-use'?'סיסמה שגויה':'שגיאה: '+(e2.code||''))}
    }else toast(/too-many/.test(e.code||'')?'יותר מדי ניסיונות – נסו שוב בעוד כמה דקות':'קוד שגוי');
  }
}

/* ----- קודי גבאים (רק מנהל) ----- */
async function setGabbaiCode(sid,code){
  if(!needCloud())return false;if(!code||code.length<6){toast('קוד גבאי חייב להיות לפחות 6 תווים');return false}
  const A=C.A,F=C.F;
  try{
    if(!C.sec){const sa=C.appMod.initializeApp(FB_CFG,'sec');C.sec=A.initializeAuth(sa,{persistence:A.inMemoryPersistence})}
    const email='g-'+sid.toLowerCase().replace(/[^a-z0-9]/g,'')+'-'+Math.random().toString(36).slice(2,7)+'@ashreichem-israel.app';
    const cr=await A.createUserWithEmailAndPassword(C.sec,email,code);const nu=cr.user.uid;await A.signOut(C.sec);
    await F.setDoc(dref('roles',nu),{role:'gabbai',sid});
    const old=C.secrets[sid];if(old&&old.uid&&old.uid!==nu){try{await F.deleteDoc(dref('roles',old.uid))}catch(e){}}
    C.secrets[sid]={code,email,uid:nu};await F.setDoc(dref('secrets','gabbaim'),{[sid]:C.secrets[sid]},{merge:true});
    await F.updateDoc(dref('shuls',sid),{login:email});
    return true;
  }catch(e){cerr(e);return false}
}
const codeOf=sid=>(C.secrets[sid]&&C.secrets[sid].code)||'';
function sendCode(id){const s=shul(id),c=codeOf(id);if(!c)return toast('עוד לא הוגדר קוד לבית הכנסת הזה');window.open('https://wa.me/?text='+encodeURIComponent(`שלום ${s.gabbai||''},\nזה קוד הכניסה שלך לעריכת "${s.name}" באפליקציית ${S.settings.appName}:\n*${c}*\nנכנסים דרך 🔑 בפינה העליונה, בוחרים את בית הכנסת ומקלידים את הקוד.\n${location.origin+location.pathname}`))}

async function saveShul(){
  if(!ED.name.trim())return toast('נא למלא שם');if(!needCloud())return;
  ED.gabbaim=(ED.gabbaim||[]).filter(g=>(g.name||'').trim()||(g.phone||'').trim());const g0=ED.gabbaim[0]||{};ED.gabbai=g0.name||'';ED.phone=g0.phone||'';
  if(!ED.gabbaim.some(g=>telOk(g.phone))&&!confirm('⚠️ לא הוזן טלפון של גבאי – זה פרט חובה. לשמור בכל זאת?'))return;
  const isNew=!shul(ED.id);if(isNew&&ROLE?.type!=='admin')return;if(!isNew&&!canEdit(ED.id))return;
  const code=(ED.code||'').trim();const oldCode=codeOf(ED.id);
  if(ROLE?.type==='admin'&&code&&code!==oldCode&&code.length<6)return toast('קוד גבאי חייב להיות לפחות 6 תווים');
  const doc=shulDoc(ED);if(!isNew&&shul(ED.id).login)doc.login=shul(ED.id).login;
  try{await C.F.setDoc(dref('shuls',ED.id),doc);}catch(e){return cerr(e)}
  if(ROLE?.type==='admin'&&code&&code!==oldCode){toast('יוצר קוד גבאי…');if(await setGabbaiCode(ED.id,code))toast('קוד הגבאי עודכן 🔑')}
  closeModal();go('shul',{id:ED.id});toast('נשמר בהצלחה ✔️');
}

  }catch(e){cerr(e)}
}

/* ----- תהילים מחולק משותף ----- */
async function takeCh(bid,n){
  if(!C.ok)return toast('צריך חיבור לאינטרנט כדי לקחת פרק');const F=C.F;
  try{
    const ok=await F.runTransaction(C.fs,async tx=>{const r=dref('th2',bid);const d=await tx.get(r);if(!d.exists())return false;const b={...d.data(),id:bid};const s=chSt(b,n);
      if(s==='done'||s==='taken')return false;if(s==='free')tx.update(r,{['ch.'+n]:{st:'r',by:U.dev,at:Date.now()}});return true});
    if(!ok)return toast('הפרק הזה כבר לא פנוי – נסו פרק אחר');openCh(bid,n);
  }catch(e){cerr(e)}
}
function takeNext(bid){const b=bookOf(bid);const n=nextFree(b);if(!n)return toast('כל הפרקים כבר נלקחו – נסו שוב בעוד כמה דקות');takeCh(bid,n)}
async function releaseCh(bid,n){closeModal();if(!C.ok)return;try{const b=bookOf(bid);if(b&&chSt(b,n)==='mine')await C.F.updateDoc(dref('th2',bid),{['ch.'+n]:C.F.deleteField()})}catch(e){}toast('הפרק הוחזר והוא פנוי לאחרים')}
async function doneCh(bid,n){
  if(!needCloud())return;const F=C.F;let fin=null;
  try{
    fin=await F.runTransaction(C.fs,async tx=>{const r=dref('th2',bid);const d=await tx.get(r);if(!d.exists())return null;const b=d.data();const ch={...b.ch,[n]:{st:'d',by:U.dev,at:Date.now()}};
      const up={['ch.'+n]:ch[n]};const cnt=Object.values(ch).filter(c=>c.st==='d').length;let done=false;if(cnt>=150&&!b.doneAt){up.doneAt=Date.now();done=true}tx.update(r,up);return{done,b:{...b,id:bid,ch}}});
  }catch(e){return cerr(e)}
  U.thMine=(U.thMine||0)+1;if(!U.th.includes(n))U.th.push(n);saveU();
  if(fin&&fin.done){try{await F.setDoc(dref('pub','th2'),{total:F.increment(1)},{merge:true});if(fin.b.auto)await F.addDoc(col('th2'),{title:fin.b.title,ded:fin.b.ded||'',auto:true,deadline:'',sid:'',created:Date.now(),doneAt:null,ch:{}})}catch(e){}
    closeModal();S.th2.total=(S.th2.total||0)+1;celebrate(fin.b);return}
  const b=fin?fin.b:bookOf(bid);const nx=nextFree(b);
